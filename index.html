async function searchAPI(q){
  const enc=encodeURIComponent(q);
  const urls=[
    API+"/"+S.lang+"/cards?name=like:"+enc+"&pagination:page=1&pagination:itemsPerPage=48",
    API+"/"+S.lang+"/cards?name="+enc+"&pagination:page=1&pagination:itemsPerPage=48"
  ];
  for(const u of urls){
    try{
      const d=await jget(u,7000);
      if(Array.isArray(d) && d.length){
        return d.slice(0,48).map(c=>({id:c.id,localId:c.localId,name:c.name,image:c.image,rarity:c.rarity||""}));
      }
    }catch(e){ /* volgende poging */ }
  }
  return [];
}

/* ============================================================
   11b. POKÉDEX
   ------------------------------------------------------------
   TCGdex heeft een endpoint per Pokédex-nummer, dus we hoeven niet op
   naam te zoeken. Dat is belangrijk: op naam zoeken zou bij "Mew" ook
   alle Mewtwo-kaarten opleveren. Het nummer is exact.
   De namen en plaatjes van de Pokémon zelf komen van PokéAPI; lukt dat
   niet, dan tonen we de nummers en werkt alles verder gewoon.
   ============================================================ */

const SPRITE="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/";
const DEXNAME_KEY="binder:dexnames:v1";

/* Generaties, zodat je door 1000+ Pokémon kunt bladeren zonder te scrollen.
   Alles boven de laatste bekende grens valt onder "Nieuw" — zo blijven ook
   Pokémon die na deze versie zijn uitgekomen gewoon zichtbaar. */
const GENS=[
  {g:1,from:1,to:151},   {g:2,from:152,to:251},  {g:3,from:252,to:386},
  {g:4,from:387,to:493}, {g:5,from:494,to:649},  {g:6,from:650,to:721},
  {g:7,from:722,to:809}, {g:8,from:810,to:905},  {g:9,from:906,to:1025}
];
const GEN_MAX=1025;

async function dexLoadIndex(){
  if(S.dex.ids.length) return;
  S.dex.loading=true; renderDex();

  // namen uit een eerdere sessie zijn meteen bruikbaar
  try{
    const cached=localGet(DEXNAME_KEY);
    if(cached) S.dex.names=JSON.parse(cached)||{};
  }catch(e){}

  /* TCGdex's losse "welke nummers bestaan er"-lijst (/dexids) bleek in de
     praktijk niet betrouwbaar te bereiken (404, ook met de exacte vorm uit
     hun eigen documentatie en SDK's). In plaats van daarvan afhankelijk te
     blijven, bouwen we de bladerlijst gewoon zelf op: elk nummer van 1 tot
     ruim boven de laatst bekende generatie. Heeft een nummer geen kaarten,
     dan zie je dat eerlijk zodra je erop tikt — dat is geen storing, dat
     klopt gewoon. De kaarten zelf halen we per Pokémon betrouwbaar op via
     het filtermechanisme dat elders in de app al bewezen werkt. */
  const top=GEN_MAX+30;
  S.dex.ids=Array.from({length:top},(_,i)=>i+1);

  // Namen ophalen via de soorten-lijst: daar is het id gelijk aan het
  // Pokédex-nummer, zonder alternatieve vormen ertussen.
  const needNames=S.dex.ids.some(n=>n<=GEN_MAX && !S.dex.names[n]);
  if(needNames){
    try{
      const limit=Math.max(1300,top+50);
      const r=await jget("https://pokeapi.co/api/v2/pokemon-species?limit="+limit,9000);
      for(const p of (r&&r.results)||[]){
        const m=String(p.url||"").match(/\/pokemon-species\/(\d+)\//);
        if(m) S.dex.names[Number(m[1])]=p.name;
      }
      try{ localSet(DEXNAME_KEY,JSON.stringify(S.dex.names)); }catch(e){}
    }catch(e){ /* nummers zijn genoeg om te bladeren */ }
  }

  S.dex.loading=false; renderDex();
}

function dexName(n){
  const raw=S.dex.names[n];
  if(!raw) return "#"+n;
  return raw.split("-").map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(" ");
}

/* hoeveel kaarten van deze Pokémon heb jij al? */
function dexOwned(n){
  const list=S.dex.cards[n];
  if(!list) return null;
  let c=0;
  for(const card of list) if(ownedQty(card.id)>0) c++;
  return c;
}

function renderDex(){
  const body=$("#dex-body");
  if(!body) return;
  if(S.dex.loading && !S.dex.ids.length){
    body.innerHTML='<div class="empty"><p>Pokédex laden…</p></div>';
    return;
  }
  if(!S.dex.ids.length){
    body.innerHTML='<div class="empty"><h3>Pokédex niet geladen</h3>'+
      '<p>Zonder verbinding met TCGdex kan de lijst niet opgehaald worden.</p></div>';
    return;
  }

  const q=(S.dex.query||"").trim().toLowerCase();
  const gen=S.dex.gen||0;

  // "Nieuw" alleen tonen als er echt Pokémon boven de bekende grens zijn
  const hasNew=S.dex.ids.some(n=>n>GEN_MAX);
  let chips='<div class="chips">'+
    '<button class="chip '+(gen===0?"is-on":"")+'" data-dexgen="0">Alles</button>'+
    GENS.map(g=>'<button class="chip '+(gen===g.g?"is-on":"")+'" data-dexgen="'+g.g+'">Gen '+g.g+'</button>').join("")+
    (hasNew?'<button class="chip '+(gen===99?"is-on":"")+'" data-dexgen="99">Nieuw</button>':'')+
  '</div>';

  let list=S.dex.ids;
  if(gen===99) list=list.filter(n=>n>GEN_MAX);
  else if(gen){
    const g=GENS.find(x=>x.g===gen);
    if(g) list=list.filter(n=>n>=g.from && n<=g.to);
  }
  if(q){
    list=list.filter(n=>{
      if(String(n)===q) return true;
      const nm=S.dex.names[n];
      return nm && nm.includes(q);
    });
  }

  if(!list.length){
    body.innerHTML=chips+'<div class="empty"><h3>Niets gevonden</h3><p>Probeer een andere naam, een nummer of een andere generatie.</p></div>';
    return;
  }

  const cap=(gen||q)?400:300;
  const shown=list.slice(0,cap);
  body.innerHTML=chips+'<div class="dexgrid">'+shown.map(n=>{
    const own=dexOwned(n);
    const known=!!S.dex.names[n];
    return '<button class="dexcell" data-dex="'+n+'">'+
      (own?'<span class="own">'+own+'</span>':'')+
      '<img src="'+SPRITE+n+'.png" alt="" loading="lazy" '+
        'onerror="this.remove();this.closest(\'.dexcell\').classList.add(\'nosprite\')">'+
      '<span class="no">#'+String(n).padStart(4,"0")+'</span>'+
      '<span class="nm">'+esc(dexName(n))+'</span>'+
      (known?'':'<span class="nm" style="font-size:10px;color:var(--label-3);font-weight:400">nieuw</span>')+
    '</button>';
  }).join("")+'</div>'+
  (list.length>shown.length
    ? '<div class="footnote">Eerste '+shown.length+' van '+list.length+' — kies een generatie of zoek om verder te komen.</div>'
    : '<div class="footnote">'+list.length+' Pokémon met kaarten in het spel.</div>');
}

/* ---------- alle kaarten van één Pokémon ---------- */

async function openDex(n){
  S.pushDex=n; S.pushSet=null; S.openBinderId=null; S.cx=null;
  $("#push-title").textContent=dexName(n);
  $("#back-label").textContent="Pokédex";
  $("#push-clear").style.display="none";
  $("#push-scroll").innerHTML='<div class="empty"><p>Kaarten laden…</p></div>';
  $("#stack").classList.add("pushed");
  $("#push").classList.add("is-open");

  if(!S.dex.cards[n]){
    try{
      // "eq:" is het expliciete gelijk-aan-filter uit TCGdex's eigen
      // documentatie voor numerieke velden — een kale "?dexId=n" bleek
      // genegeerd te worden en gaf de hele database terug.
      const cards=await jget(API+"/"+S.lang+"/cards?dexId=eq:"+n+"&pagination:itemsPerPage=80",9000);
      // Vangnet: mocht het filter alsnog genegeerd worden, dan begrenzen we
      // in elk geval hoeveel we proberen te tekenen, zodat de pagina niet
      // vastloopt op duizenden kaarten tegelijk.
      const list=(cards||[]).slice(0,80);
      S.dex.cards[n]=list.map(c=>({
        id:c.id, localId:c.localId, name:c.name, image:c.image, rarity:c.rarity||"", variants:null
      }));
      // ook opzoekbaar maken, zodat het kaartvenster ze kan openen
      for(const c of S.dex.cards[n]) S.found[c.id]=c;
    }catch(e){
      // NIET blijvend als "leeg" onthouden: dat zou een tijdelijke hapering
      // voor altijd tot "geen kaarten bekend" maken. Gewoon opnieuw proberen
      // de volgende keer dat je deze Pokémon opent.
      renderPushDexError();
      return;
    }
  }
  renderPushDex();
}

function renderPushDexError(){
  $("#push-scroll").innerHTML='<div class="empty"><h3>Ophalen mislukt</h3>'+
    '<p>De kaarten van deze Pokémon konden niet geladen worden. Dit is geen "geen kaarten bekend" — het ophalen zelf is misgegaan. Sluit dit scherm en probeer het opnieuw.</p></div>';
}

let dexScope="main"; // main | all — hoofdsets tonen, of ook promo's/zijproducten

function renderPushDex(){
  const n=S.pushDex;
  const cards=S.dex.cards[n]||[];
  const own=dexOwned(n)||0;
  const suspicious=cards.length>=80; // (bijna) tegen de vangnetgrens aan — vermoedelijk kreeg je de hele database, niet een filtering

  let h='<div class="dexhero">'+
    '<img src="'+SPRITE+n+'.png" alt="" onerror="this.style.visibility=\'hidden\'">'+
    '<div class="t"><h3>'+esc(dexName(n))+'</h3>'+
    '<div class="s">#'+String(n).padStart(4,"0")+' · '+cards.length+' kaart'+(cards.length===1?"":"en")+' in het spel</div>'+
    '</div>'+ring(cards.length?own/cards.length:0,52,5)+'</div>';

  if(suspicious){
    h+='<div class="banner"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>'+
       '<div><b>Dit klopt vermoedelijk niet</b> — zoveel kaarten heeft geen enkele Pokémon. Het filter van TCGdex lijkt genegeerd te zijn, dus wat je hieronder ziet is waarschijnlijk niet allemaal '+esc(dexName(n))+'.</div></div>';
  }

  h+='<div class="footnote">Je hebt <b>'+own+'</b> van de '+cards.length+' kaarten van deze Pokémon.</div>';

  if(!cards.length){
    h+='<div class="empty"><h3>Geen kaarten gevonden</h3>'+
       '<p>Er zijn geen kaarten van deze Pokémon, of de lijst kon niet geladen worden.</p></div>';
    $("#push-scroll").innerHTML=h;
    return;
  }

  const anySide=cards.some(c=>{ const s=findSet(setIdOf(c.id)); return s&&isSideSet(s); });
  h+='<div class="cx-row" style="padding:0 var(--gut) 12px;margin:0"><div class="cx-seg" style="max-width:280px">'+
     '<button data-dexscope="main" class="'+(dexScope==="main"?"is-on":"")+'">Hoofdsets</button>'+
     '<button data-dexscope="all" class="'+(dexScope==="all"?"is-on":"")+'">Alles</button>'+
     '</div>'+
     '<button class="scan-btn" id="dex-color-toggle" style="'+(S.showColor?"background:var(--orange);color:#fff":"")+'" aria-pressed="'+(S.showColor?"true":"false")+'" title="Kleur voor ontbrekende kaarten">'+
     '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a4 4 0 0 0 0 8 4 4 0 0 1 0 8"/><circle cx="8.2" cy="10.2" r="1" fill="currentColor" stroke="none"/><circle cx="15.8" cy="10.2" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="15.5" r="1" fill="currentColor" stroke="none"/></svg></button>'+
     '</div>';
  if(!anySide) dexScope="all"; // niets om te verbergen: geen zin om te kunnen wisselen

  // per set groeperen, dan op echte releasedatum sorteren — oud naar nieuw.
  // Onbekende datums vallen terug op de vaste tijdperk-volgorde.
  const groups={}, order=[];
  for(const c of cards){
    const sid=setIdOf(c.id);
    const set=findSet(sid);
    if(dexScope==="main" && set && isSideSet(set)) continue;
    if(!groups[sid]){ groups[sid]=[]; order.push(sid); }
    groups[sid].push(c);
  }
  order.sort((a,b)=>{
    const sa=findSet(a), sb=findSet(b);
    const da=(sa&&sa.date)||"", db=(sb&&sb.date)||"";
    if(da&&db) return da.localeCompare(db);
    if(da&&!db) return -1;
    if(!da&&db) return 1;
    return serieRank(sa&&sa.serie)-serieRank(sb&&sb.serie) ||
           String(a).localeCompare(String(b),undefined,{numeric:true});
  });

  if(!order.length){
    h+='<div class="empty"><h3>Niets in deze weergave</h3><p>Zet "Alles" aan om ook promo\'s en zijproducten te zien.</p></div>';
    $("#push-scroll").innerHTML=h;
    return;
  }

  for(const sid of order){
    const set=findSet(sid);
    const g=groups[sid];
    const gOwn=g.filter(c=>ownedQty(c.id)>0).length;
    const year=set&&set.date?set.date.slice(0,4):"";
    h+='<div class="section-hdr row"><span>'+(year?year+' · ':'')+esc(set?set.name:sid)+'</span>'+
       '<span style="text-transform:none;font-size:12px">'+gOwn+'/'+g.length+'</span></div>';
    h+='<div class="grid">'+g.map(c=>slotHTML(c)).join("")+'</div>';
  }
  $("#push-scroll").innerHTML=h;
}

/* ============================================================
   12b. BINDER CONCEPTS — pagina's samenstellen
   ------------------------------------------------------------
   De indeling is één vlakke lijst (seq) met een kaart-ID of null per
   vakje. Door die lijst in stukken van perPage te knippen ontstaan de
   pagina's, zodat wisselen tussen 4/9/16 vanzelf herverdeelt in plaats
   van de indeling weg te gooien.
   ============================================================ */

function cxDim(n){ return n===4?2:(n===12||n===16)?4:3; }

function cxEnsure(){
  const c=S.cx, per=c.perPage;
  const need=(c.page+c.spread)*per;
  while(c.seq.length<need) c.seq.push(null);
  while(c.seq.length%per!==0) c.seq.push(null);
  if(!c.seq.length) for(let i=0;i<per;i++) c.seq.push(null);
}
function cxPages(){ return Math.max(1,Math.ceil(S.cx.seq.length/S.cx.perPage)); }

function cxTrayCards(){
  const c=S.cx;
  let list;
  if(c.source==="own"){
    const seen=[], out=[];
    for(const k in S.coll){
      const id=k.split("|")[0];
      if(seen.includes(id)) continue;
      seen.push(id);
      const m=S.meta[id];
      if(m) out.push(m);
    }
    list=out;
  } else {
    list=(S.cards[c.setId]||[]);
  }
  const q=(S.cx.query||"").trim().toLowerCase();
  if(!q) return list;
  return list.filter(card=>
    String(card.localId).toLowerCase()===q ||
    (card.name && card.name.toLowerCase().includes(q))
  );
}

/* ---------- bewaren en terughalen ---------- */

function cxCount(seq){ return (seq||[]).filter(Boolean).length; }

/* ---------- de bibliotheek: aanmaken, openen, verwijderen ----------
   Een binder is vanaf nu altijd "live": S.cx wijst naar het echte object
   in S.binders, dus elke wijziging in de editor is meteen de bewaarde
   toestand. Geen apart concept meer om te "bewaren" of te "laden". */

function cxBlankBinder(name){
  return {
    id:"b"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    name: name || "Nieuwe binder",
    perPage:9, spread:1, backing:"black", coverColor:null,
    source:"own", setId:null, seq:[], page:0
  };
}

function openBinder(id){
  const b=S.binders.find(x=>x.id===id); if(!b) return;
  S.openBinderId=id;
  S.cx=b;                 // live verwijzing, geen kopie
  b.sel=[]; b.query="";   // tijdelijke bedieningsstatus, altijd vers bij openen
  cxEnsure();

  $("#push-title").textContent=b.name||"Binder";
  $("#back-label").textContent="Binders";
  $("#push-clear").style.display="";
  S.pushSet=null; S.pushDex=null;
  $("#stack").classList.add("pushed");
  $("#push").classList.add("is-open");
  renderConcept();

  if(b.source==="all" && b.setId && !S.cards[b.setId]) fetchCards(b.setId).then(renderConcept);
}

function newBinder(){
  const b=cxBlankBinder("Binder "+(S.binders.length+1));
  S.binders.unshift(b);
  saveStore();
  renderShelf();
  openBinder(b.id);
}

function deleteBinder(id){
  S.binders=S.binders.filter(b=>b.id!==id);
  if(S.openBinderId===id){ S.openBinderId=null; S.cx=null; closePush(); }
  saveStore(); renderShelf(); toast("Verwijderd");
}

function renameBinder(name){
  if(!S.cx) return;
  S.cx.name=(name||"").trim() || "Naamloze binder";
  $("#push-title").textContent=S.cx.name;
  saveStore();
}

function bookColorStyle(b){

/* ---------- meerdere kaarten tegelijk ---------- */

function cxToggleSel(id){
  const i=S.cx.sel.indexOf(id);
  if(i>-1) S.cx.sel.splice(i,1); else S.cx.sel.push(id);
  tap(); renderConcept();
}

function cxAddSelected(){
  const sel=S.cx.sel.slice();
  if(!sel.length) return;
  const used={}; for(const id of S.cx.seq) if(id) used[id]=1;
  const queue=sel.filter(id=>!used[id]);
  if(!queue.length){ toast("Die staan er al in"); S.cx.sel=[]; renderConcept(); return; }

  let i=S.cx.page*S.cx.perPage, placed=0;
  while(queue.length){
    if(i>=S.cx.seq.length){ for(let k=0;k<S.cx.perPage;k++) S.cx.seq.push(null); }
    if(!S.cx.seq[i]){ S.cx.seq[i]=queue.shift(); placed++; }
    i++;
    if(i>5000) break;
  }
  S.cx.sel=[];
  tap(); saveStore(); renderConcept();
  toast(placed+" kaart"+(placed===1?"":"en")+" toegevoegd");
}

/* Vult de lege vakjes vanaf de huidige pagina met kaarten die nog nergens
   staan, in de volgorde van de lade. Bij een set van 200 kaarten is alles
   met de hand slepen geen optie; dit doet het grove werk en daarna
   verschuif je alleen nog wat je anders wilt. */
function cxAutoFill(){
  const cards=cxTrayCards();
  if(!cards.length){ toast("Geen kaarten in de lade"); return; }
  const used={}; for(const id of S.cx.seq) if(id) used[id]=1;
  const queue=cards.filter(c=>!used[c.id]);
  if(!queue.length){ toast("Alles uit de lade staat er al"); return; }

  let i=S.cx.page*S.cx.perPage, placed=0;
  while(queue.length){
    if(i>=S.cx.seq.length){
      for(let k=0;k<S.cx.perPage;k++) S.cx.seq.push(null);
    }
    if(!S.cx.seq[i]){ S.cx.seq[i]=queue.shift().id; placed++; }
    i++;
    if(i>5000) break;   // veiligheidsrem
  }
  tap(); saveStore(); renderConcept();
  toast(placed+" kaarten geplaatst");
}

/* ---------- slepen ----------
   Op touch begint slepen pas na kort vasthouden, precies zoals iOS zelf
   doet. Daardoor blijft gewoon scrollen mogelijk: een veeg is scrollen,
   vasthouden is oppakken. Met de muis start het na een paar pixels beweging,
   zodat een gewone klik nog steeds een klik is. */
let cxDrag=null, cxPending=null;
const CX_HOLD=200;   // ms vasthouden op touch
const CX_SLOP=6;     // px beweging met de muis

function cxLock(on){
  const sc=$("#concept-scroll");
  if(sc) sc.classList.toggle("cx-locked",!!on);
  document.body.classList.toggle("cx-locked",!!on);
}

function cxStartDrag(x,y,payload,srcEl){
  const rect=srcEl.getBoundingClientRect();
  cxDrag={payload, w:Math.max(56,rect.width), h:Math.max(78,rect.height)};
  const img=srcEl.querySelector("img");
  const g=document.createElement("div");
  g.id="cx-ghost";
  g.style.width=cxDrag.w+"px"; g.style.height=cxDrag.h+"px";
  g.style.left=x+"px"; g.style.top=y+"px";
  g.innerHTML = img ? '<img src="'+img.getAttribute("src")+'" alt="">'
                    : '<div style="width:100%;height:100%;background:#8884"></div>';
  document.body.appendChild(g);
  if(payload.type==="slot") srcEl.classList.add("dragging");
  cxLock(true);
  tap();
}

function cxMoveDrag(x,y){
  const g=document.getElementById("cx-ghost");
  if(g){ g.style.left=x+"px"; g.style.top=y+"px"; }
  const el=document.elementFromPoint(x,y);
  const slot=el&&el.closest?el.closest("[data-cxslot]"):null;
  $$(".cx-slot.drop-target").forEach(s=>{ if(s!==slot) s.classList.remove("drop-target"); });
  if(slot) slot.classList.add("drop-target");
}

function cxFinishDrag(x,y){
  const g=document.getElementById("cx-ghost"); if(g) g.remove();
  const el=document.elementFromPoint(x,y);
  const slot=el&&el.closest?el.closest("[data-cxslot]"):null;
  $$(".cx-slot.drop-target").forEach(s=>s.classList.remove("drop-target"));
  $$(".cx-slot.dragging").forEach(s=>s.classList.remove("dragging"));
  cxLock(false);

  const d=cxDrag; cxDrag=null;
  if(!slot || !d) return;

  const to=Number(slot.dataset.cxslot);
  if(d.payload.type==="tray"){
    // dezelfde kaart mag maar op één plek staan: stond hij al ergens,
    // dan verplaatsen we hem in plaats van te verdubbelen
    const was=S.cx.seq.indexOf(d.payload.id);
    if(was>-1 && was!==to) S.cx.seq[was]=null;
    S.cx.seq[to]=d.payload.id;
  } else {
    const from=d.payload.idx;
    if(from===to) return;
    const tmp=S.cx.seq[to];
    S.cx.seq[to]=S.cx.seq[from];
    S.cx.seq[from]=tmp;      // ruilen, zodat er nooit iets verdwijnt
  }
  saveStore(); renderConcept();
}

function cxCancelPending(){
  if(!cxPending) return;
  clearTimeout(cxPending.timer);
  if(cxPending.el) cxPending.el.classList.remove("lifted");
  cxPending=null;
}

document.addEventListener("pointerdown",e=>{
  if(S.tab!=="concept") return;
  if(e.target.closest("[data-cxrm]")) return;
  const slot=e.target.closest("[data-cxslot].filled");
  const empty=e.target.closest(".cx-empty");
  const chip=e.target.closest("[data-cxtray]");
  if(!slot && !empty && !chip) return;

  if(empty){
    // een leeg vakje sleep je niet op — gewoon een tik opent de kaartkiezer
    cxPending={el:empty,payload:{type:"emptytap",idx:Number(empty.dataset.cxslot)},x:e.clientX,y:e.clientY,touch:false,timer:null};
    return;
  }

  const el=slot||chip;
  const payload = slot ? {type:"slot",idx:Number(slot.dataset.cxslot)}
                       : {type:"tray",id:chip.dataset.cxtray};
  cxPending={el,payload,x:e.clientX,y:e.clientY,touch:e.pointerType==="touch",timer:null};

  if(cxPending.touch){
    // even wachten: een veeg is scrollen, vasthouden is oppakken
    cxPending.timer=setTimeout(()=>{
      if(!cxPending) return;
      const p=cxPending; cxPending=null;
      p.el.classList.remove("lifted");
      cxStartDrag(p.x,p.y,p.payload,p.el);
    },CX_HOLD);
    el.classList.add("lifted");
  }
},{passive:true});

document.addEventListener("pointermove",e=>{
  if(cxDrag){ e.preventDefault(); cxMoveDrag(e.clientX,e.clientY); return; }
  if(!cxPending) return;
  const dx=Math.abs(e.clientX-cxPending.x), dy=Math.abs(e.clientY-cxPending.y);
  if(cxPending.payload.type==="emptytap"){
    if(dx>CX_SLOP||dy>CX_SLOP) cxCancelPending(); // dit was scrollen, geen tik
    return;
  }
  if(cxPending.touch){
    // bewogen vóór de tijd om: dit was scrollen, geen slepen
    if(dx>CX_SLOP||dy>CX_SLOP) cxCancelPending();
  } else if(dx>CX_SLOP||dy>CX_SLOP){
    const p=cxPending; cxPending=null;
    cxStartDrag(e.clientX,e.clientY,p.payload,p.el);
    cxMoveDrag(e.clientX,e.clientY);
  }
},{passive:false});

document.addEventListener("pointerup",e=>{
  if(cxDrag){ cxFinishDrag(e.clientX,e.clientY); return; }
  if(cxPending){
    // niet gesleept: een tik selecteert in de lade, opent een kaart, of opent de kiezer
    const p=cxPending; cxCancelPending();
    if(p.payload.type==="slot"){
      const id=S.cx.seq[p.payload.idx];
      if(id) openCard(id);
    } else if(p.payload.type==="tray"){
      cxToggleSel(p.payload.id);
    } else if(p.payload.type==="emptytap"){
      openSlotPicker(p.payload.idx);
    }
  }
});
document.addEventListener("pointercancel",()=>{
  cxCancelPending();
  if(!cxDrag) return;
  const g=document.getElementById("cx-ghost"); if(g) g.remove();
  $$(".cx-slot.drop-target").forEach(s=>s.classList.remove("drop-target"));
  $$(".cx-slot.dragging").forEach(s=>s.classList.remove("dragging"));
  cxLock(false);
  cxDrag=null;
});

async function renderPickResults(){
  const box=$("#pick-results"); if(!box) return;
  const p=S.pick;

  if(p.setId){
    box.innerHTML='<div class="empty"><p>Kaarten laden…</p></div>';
    await fetchCards(p.setId);
    const list=S.cards[p.setId]||[];
    box.innerHTML=list.length
      ? '<div class="grid">'+list.map(pickTileHTML).join("")+'</div>'
      : '<div class="empty"><h3>Geen kaarten</h3></div>';
    return;
  }

  const q=(p.query||"").trim();
  if(q.length<2){
    box.innerHTML='<div class="hint">Typ minstens twee letters om te zoeken, of kies hierboven een set.</div>';
    return;
  }
  box.innerHTML='<div class="hint">Zoeken…</div>';
  const mySeq=++S.pick._seq;
  const results=await searchAPI(q);
  if(mySeq!==S.pick._seq) return; // een nieuwere zoekopdracht is al onderweg
  box.innerHTML=results.length
    ? '<div class="grid">'+results.map(pickTileHTML).join("")+'</div>'
    : '<div class="empty"><h3>Niets gevonden</h3><p>Probeer een andere naam.</p></div>';

function assignToSlot(cardId){
  const c=S.cx; if(!c || c.pickSlot==null) return;
  const idx=c.pickSlot;
  const was=c.seq.indexOf(cardId);
  if(was>-1 && was!==idx) c.seq[was]=null;
  c.seq[idx]=cardId;
  const r=resolveCard(cardId);
  if(r) rememberMeta(r.c, r.set&&r.set.id);
  c.pickSlot=null;
  tap(); saveStore(); closeSheet(); renderConcept();
}

const CSV_COLS=["id","set","nummer","naam","variant","aantal","staat","aankoop"];

function csvRow(a){
  return a.map(f=>{
    const s=String(f==null?"":f);
    return /[";\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(";");
}
function num2(n){ return n==null||n==="" ? "" : String(n).replace(".",","); }
function varLabel(k){ return (VARIANTS.find(v=>v.k===k)||{}).label||""; }
function condLabel(k){ return (CONDITIONS.find(c=>c.k===k)||{}).label||""; }

function rowsForCard(c,setName,setId){
  const owned=VARIANTS.filter(v=>(S.coll[c.id+"|"+v.k]||0)>0);
  if(!owned.length) return [[c.id,setName,c.localId,c.name||"","","","",""]];
  return owned.map(v=>{
    const k=c.id+"|"+v.k;
    return [c.id,setName,c.localId,c.name||"",v.label,S.coll[k],condLabel(S.cond[k]||"nm"),num2(S.paid[k])];
  });
}

function buildCSV(scope){
  const rows=[];
  if(scope==="set" && S.tplSet){
    const set=findSet(S.tplSet), cards=S.cards[S.tplSet]||[];
    for(const c of cards) rows.push(...rowsForCard(c,set?set.name:S.tplSet,S.tplSet));
  }
  else if(scope==="missing"){
    for(const sid in S.cards){
      const set=findSet(sid);
      for(const c of S.cards[sid]) if(ownedQty(c.id)===0) rows.push([c.id,set?set.name:sid,c.localId,c.name||"","","","",""]);
    }
  }
  else { // volledige verzameling
    for(const k in S.coll){
      const [id,variant]=k.split("|");
      const m=S.meta[id]||{};
      const set=findSet(m.setId||setIdOf(id));
      rows.push([id,set?set.name:(m.setId||setIdOf(id)),m.localId||id.split("-").pop(),m.name||"",
                 varLabel(variant),S.coll[k],condLabel(S.cond[k]||"nm"),num2(S.paid[k])]);
    }
  }
  return [csvRow(CSV_COLS)].concat(rows.map(csvRow)).join("\r\n");
}

function downloadCSV(text,name){
  try{
    const blob=new Blob(["\uFEFF"+text],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},800);
    toast("Bestand gedownload");
  }catch(e){
    toast("Downloaden lukt hier niet — kopieer de tekst");
  }
}

/* ---------- inlezen ---------- */

function detectDelim(line){
  const c={";":0,",":0,"\t":0}; let q=false;
  for(const ch of line){ if(ch==='"') q=!q; else if(!q && ch in c) c[ch]++; }
  return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||";";
}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  const d=detectDelim((text.split(/\r?\n/)[0])||"");
  const rows=[]; let row=[],field="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; }
      else field+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===d){ row.push(field); field=""; }
      else if(ch==="\n"){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(ch!=="\r") field+=ch;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(f=>String(f).trim()!==""));
}

const COLMAP={
  id:["id","kaartid","cardid","kaart"],
  set:["set","setnaam","expansion","uitbreiding","serie"],
  nummer:["nummer","nr","number","cardnumber","kaartnummer","no"],
  naam:["naam","name","kaartnaam","cardname"],
  variant:["variant","versie","printing","finish","foil"],
  aantal:["aantal","qty","quantity","count","stuks","amount","hoeveelheid"],
  staat:["staat","conditie","condition","cond","kwaliteit"],
  aankoop:["aankoop","aankoopprijs","prijs","price","paid","purchaseprice","betaald","inkoop"]
};
const normH = s => String(s).toLowerCase().replace(/[^a-z]/g,"");

function mapHeader(hdr){
  const idx={};
  hdr.forEach((h,i)=>{
    const n=normH(h);
    for(const key in COLMAP) if(COLMAP[key].includes(n)) idx[key]=i;
  });
  return idx;
}
function normVariant(s){
  const n=normH(s);
  if(!n) return "normal";
  if(/rev/.test(n)) return "reverse";
  if(/holo|foil|glans/.test(n)) return "holo";
  return "normal";
}
function normCond(s){
  const n=normH(s);
  if(!n) return "nm";
  if(/nabijmint|nm|nearmint|mint/.test(n)) return "nm";
  if(/uitstekend|ex|excellent/.test(n)) return "ex";
  if(/goed|gd|good/.test(n)) return "gd";
  if(/gespeeld|pl|played|poor|slecht/.test(n)) return "pl";
  return "nm";
}
function normNum(s){
  return String(s||"").trim().split("/")[0].trim().replace(/^0+(?=\d)/,"");
}
function parseAmount(s){
  const v=parseFloat(String(s||"").replace(/[^0-9,.\-]/g,"").replace(",","."));
  return isNaN(v)?null:v;
}

/* losse regels zoals "2x base1-4" of "3 base1-4" */
function parseLines(text){
  const out=[];
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim(); if(!line) continue;
    const m=line.match(/^(\d+)\s*[x×]?\s+(.*)$/i);
    if(!m) continue;
    const qty=parseInt(m[1],10);
    const idm=m[2].match(/([a-z0-9.]+-[a-z0-9]+)\s*$/i);
    if(!idm) continue;
    out.push({id:idm[1], qty, variant:"normal", cond:"nm", paid:null});
  }
  return out;
}

function readEntries(text){
  const rows=parseCSV(text);
  if(rows.length && rows[0].length>=2){
    const idx=mapHeader(rows[0]);
    const hasHeader=Object.keys(idx).length>=2;
    const body=hasHeader?rows.slice(1):rows;
    const I=hasHeader?idx:{id:0,set:1,nummer:2,naam:3,variant:4,aantal:5,staat:6,aankoop:7};
    return body.map(r=>({
      id:(r[I.id]||"").trim(),
      set:(r[I.set]||"").trim(),
      nummer:normNum(r[I.nummer]),
      naam:(r[I.naam]||"").trim(),
      variant:normVariant(r[I.variant]),
      qty:parseInt(String(r[I.aantal]||"").replace(/[^0-9-]/g,""),10),
      cond:normCond(r[I.staat]),
      paid:parseAmount(r[I.aankoop])
    }));
  }
  return parseLines(text);
}

/* ---------- toepassen ---------- */

function snapshot(){
  S.snap=JSON.stringify({coll:S.coll,cond:S.cond,paid:S.paid,varOverride:S.varOverride,order:S.order,meta:S.meta});
}
function restoreSnapshot(){
  if(!S.snap) return;
  const d=JSON.parse(S.snap);
  S.coll=d.coll; S.cond=d.cond; S.paid=d.paid; S.varOverride=d.varOverride||{}; S.order=d.order; S.meta=d.meta;
  S.snap=null; S.impResult=null;
  saveStore(); refreshAll(); renderImport();
  toast("Import teruggedraaid");
}

async function runImport(text,mode){
  let entries=readEntries(text);
  entries=entries.filter(e=>e && (e.id||e.nummer));
  if(!entries.length) return {error:"Geen bruikbare regels gevonden."};

  const skipped=entries.filter(e=>!e.qty||e.qty<1).length;
  entries=entries.filter(e=>e.qty&&e.qty>0);

  // sets opzoeken voor regels zonder id
  const need=entries.filter(e=>!e.id&&e.set);
  if(need.length){
    const byName={};
    for(const lang of ["en","ja"]) for(const s of (S.sets[lang]||[])) byName[s.name.toLowerCase()]=s.id;
    const wanted=Array.from(new Set(need.map(e=>byName[e.set.toLowerCase()]).filter(Boolean))).slice(0,10);
    for(const sid of wanted){ try{ await fetchCards(sid); }catch(e){} }
    for(const e of need){
      const sid=byName[e.set.toLowerCase()]; if(!sid) continue;
      const c=(S.cards[sid]||[]).find(x=>normNum(x.localId)===e.nummer);
      if(c) e.id=c.id;
    }
  }

  const unknown=entries.filter(e=>!e.id);
  const good=entries.filter(e=>e.id);
  if(!good.length) return {error:"Geen enkele regel kon aan een kaart gekoppeld worden. Zorg dat de kolom 'id' is ingevuld."};

  snapshot();

  let applied=0, added=0;
  for(const e of good){
    const key=e.id+"|"+e.variant;
    if(mode==="set") S.coll[key]=e.qty; else S.coll[key]=(S.coll[key]||0)+e.qty;
    added+=e.qty;
    if(e.cond) S.cond[key]=e.cond;
    if(e.paid!=null) S.paid[key]=e.paid;
    if(!S.order.includes(e.id)) S.order.push(e.id);
    delete S.wish[e.id];
    if(!S.meta[e.id]){
      const r=resolveCard(e.id);
      if(r) rememberMeta(r.c, r.set&&r.set.id);
      else S.meta[e.id]={id:e.id,localId:e.nummer||e.id.split("-").pop(),name:e.naam||null,image:null,setId:setIdOf(e.id)};
    }
    applied++;
  }
  saveStore(); refreshAll();
  return {applied, added, skipped, unknown:unknown.slice(0,6).map(e=>(e.set?e.set+" ":"")+(e.nummer||e.naam||"?")), unknownCount:unknown.length};
}

function goTab(t){
  S.tab=t;
  closePush();       // een openstaand subscherm mag nooit blijven hangen bij het wisselen van tab
  closeSheet();       // hetzelfde geldt voor een openstaand venster
  $$(".screen").forEach(s=>s.classList.toggle("is-active",s.dataset.tab===t));
  $$(".tab").forEach(b=>b.classList.toggle("is-active",b.dataset.goto===t));
  if(t==="home") renderHome();
  if(t==="sets") renderSets();
  if(t==="search"){
    if(S.dex.mode==="dex"){ dexLoadIndex(); renderDex(); } else renderSearch();
  }
  if(t==="coll") renderColl();
  if(t==="concept") renderShelf();
}

let openSheetEl=null;
function openSheet(sel){
  if(sel==="#sheet-settings") renderSettings();
  if(sel==="#sheet-sort") renderSort();
  if(sel==="#sheet-export") renderExport();
  if(sel==="#sheet-account") renderAccount();
  if(sel==="#sheet-template"){
    if(!S.tplPicking){
      if(!S.tplSet) S.tplSet=S.addSet||S.recentSets[0]||((S.sets[S.lang]||[])[0]||{}).id;
      if(S.tplScope==="set" && S.tplSet && !S.cards[S.tplSet]) fetchCards(S.tplSet).then(renderTemplate);
    }
    renderTemplate();
  }
  if(sel==="#sheet-pick") renderPicker();
  if(sel==="#sheet-import"){ S.impResult=null; renderImport(); }
  if(sel==="#sheet-add") renderAdd();
  const next=$(sel);
  if(openSheetEl && openSheetEl!==next) openSheetEl.classList.remove("is-open");
  openSheetEl=next;
  openSheetEl.classList.add("is-open");
  $("#scrim").classList.add("is-on");
  $(".fab").classList.add("is-hidden");
}
function closeSheet(){
  if(openSheetEl) openSheetEl.classList.remove("is-open");
  $("#scrim").classList.remove("is-on");
  $(".fab").classList.remove("is-hidden");
  const was=openSheetEl;
  openSheetEl=null;
  if(was && was.id==="sheet-add"){ S.addLog=[]; refreshAll(); }
}

function refreshAll(){
  if(S.tab==="home") renderHome();
  if(S.tab==="sets") renderSets();
  if(S.tab==="coll") renderColl();
  if(S.tab==="search"){ if(S.dex.mode==="dex") renderDex(); else renderSearch(); }
  if(S.tab==="concept") renderConcept();
  if(S.pushSet) renderPush();
  if(S.pushDex) renderPushDex();
  if(openSheetEl&&openSheetEl.id==="sheet-card") renderCardSheet();
}

/* segmented control-thumb positioneren */
function syncSeg(el){
  const btns=$$("button",el), on=btns.find(b=>b.classList.contains("is-on"))||btns[0];
  const i=btns.indexOf(on), w=100/btns.length;
  const thumb=$(".thumb",el);
  thumb.style.width="calc("+w+"% - 2px)";
  thumb.style.transform="translateX(calc("+(i*100)+"% + "+(i?2:0)+"px))";
}

/* scroll → navbar-titel */
$$(".scroll").forEach(sc=>{
  sc.addEventListener("scroll",()=>{
    const bar=sc.parentElement.querySelector(".navbar");
    if(bar) bar.classList.toggle("is-scrolled", sc.scrollTop>36);
  },{passive:true});
});

document.addEventListener("click",e=>{
  const t=e.target;

  const tab=t.closest(".tab");
  if(tab){ goTab(tab.dataset.goto); return; }

  /* --- snel toevoegen --- */
  const qa=t.closest("[data-qadd]");
  if(qa){ quickAdd(qa.dataset.qadd); return; }

  const addSet=t.closest("[data-addset]");
  if(addSet){ S.addSet=addSet.dataset.addset; S.addMode="grid"; window._addQuery=""; renderAdd(); return; }

  const addMode=t.closest("[data-addmode]");
  if(addMode){ S.addMode=addMode.dataset.addmode; renderAdd(); return; }

  const addVar=t.closest("[data-addvar]");
  if(addVar){
    S.addVariant=addVar.dataset.addvar;
    $$("#addvar-seg button").forEach(b=>b.classList.toggle("is-on",b===addVar));
    syncSeg($("#addvar-seg"));
    if(S.pushSet) renderPush();
    return;
  }

  if(t.closest("#add-go")){ submitNumber(); return; }
  if(t.closest("#add-undo")){ undoAdd(); return; }

  if(t.closest("#quick-toggle")){
    S.quickInSet=!S.quickInSet;
    toast(S.quickInSet?"Snel bewerken aan":"Snel bewerken uit");
    renderPush(); return;
  }
  if(t.closest("#color-toggle")){
    S.showColor=!S.showColor;
    document.documentElement.classList.toggle("show-color",S.showColor);
    saveStore();
    toast(S.showColor?"Kleur aan":"Kleur uit");
    renderPush(); return;
  }
  const gs=t.closest("[data-gridstep]");
  if(gs){
    const [cardId,d]=gs.dataset.gridstep.split("|");
    gridStep(cardId,Number(d));
    return;
  }

  if(t.closest("#copy-csv")){
    const box=$("#csv-box");
    try{ navigator.clipboard.writeText(box.value); toast("Gekopieerd"); }
    catch(err){ box.select(); toast("Selecteer en kopieer handmatig"); }
    return;
  }
  if(t.closest("#export-download")){ downloadCSV($("#csv-box").value,"binder-verzameling.csv"); return; }

  /* --- sjabloon --- */
  const tplScope=t.closest("[data-tplscope]");
  if(tplScope){
    S.tplScope=tplScope.dataset.tplscope;
    if(S.tplScope==="set" && S.tplSet && !S.cards[S.tplSet]){
      fetchCards(S.tplSet).then(renderTemplate);
    }
    renderTemplate(); return;
  }
  if(t.closest("#tpl-pick")){ S.tplPicking=true; window._tplQuery=""; renderTemplate(); return; }
  const tplSet=t.closest("[data-tplset]");
  if(tplSet){
    if(window._pickSet){
      window._pickSet=false;
      S.pick.setId=tplSet.dataset.tplset; S.pick.query=""; S.tplPicking=false;
      closeSheet();
      openSheet("#sheet-pick");
      return;
    }
    if(window._cxPicking){
      window._cxPicking=false;
      S.cx.setId=tplSet.dataset.tplset; S.tplPicking=false;
      closeSheet(); saveStore(); renderConcept();
      fetchCards(S.cx.setId).then(renderConcept);
      return;
    }
    S.tplSet=tplSet.dataset.tplset; S.tplPicking=false; S.tplScope="set";
    $("#template-body").innerHTML='<div class="empty"><p>Kaarten laden…</p></div>';
    fetchCards(S.tplSet).then(renderTemplate);
    return;
  }
  if(t.closest("#tpl-copy")){
    const box=$("#tpl-box");
    try{ navigator.clipboard.writeText(box.value); toast("Gekopieerd"); }
    catch(err){ box.select(); toast("Selecteer en kopieer handmatig"); }
    return;
  }
  if(t.closest("#tpl-download")){
    const set=findSet(S.tplSet);
    const name = S.tplScope==="set" ? "sjabloon-"+((set&&set.name)||S.tplSet).toLowerCase().replace(/[^a-z0-9]+/g,"-")+".csv"
               : S.tplScope==="missing" ? "sjabloon-ontbrekend.csv" : "binder-verzameling.csv";
    downloadCSV($("#tpl-box").value,name); return;
  }

  /* --- import --- */
  const impMode=t.closest("[data-impmode]");
  if(impMode){
    S.impMode=impMode.dataset.impmode;
    $$("#imp-seg button").forEach(b=>b.classList.toggle("is-on",b===impMode));
    syncSeg($("#imp-seg")); return;
  }
  if(t.closest("#imp-file")){ $("#file-input").click(); return; }
  if(t.closest("#imp-undo")){ restoreSnapshot(); return; }
  if(t.closest("#imp-run")){
    const text=($("#imp-box").value||"").trim();
    if(!text){ toast("Plak eerst je regels of kies een bestand"); return; }
    const btn=t.closest("#imp-run"); btn.textContent="Bezig…"; btn.disabled=true;
    runImport(text,S.impMode).then(res=>{
      S.impResult=res; renderImport();
      if(!res.error) toast(res.applied+" regels verwerkt");
    }).catch(()=>{
      S.impResult={error:"Het bestand kon niet gelezen worden."}; renderImport();
    });
    return;
  }

  const condBtn=t.closest("[data-cond]");
  if(condBtn){
    const p=condBtn.dataset.cond.split("|");
    S.cond[p[0]+"|"+p[1]]=p[2];
    tap(); saveStore(); renderCardSheet(); return;
  }

  const serieBtn=t.closest("[data-serie]");
  if(serieBtn){
    S.serie=serieBtn.dataset.serie||null;
    renderSets();
    const sc=$("#sets-scroll"); if(sc) sc.scrollTop=0;
    return;
  }

  const addVariant=t.closest("[data-addvariant]");
  if(addVariant){
    const [cid,vk]=addVariant.dataset.addvariant.split("|");
    const cur=S.varOverride[cid] || variantInfo(cid).list.slice();
    if(!cur.includes(vk)) cur.push(vk);
    S.varOverride[cid]=cur;
    tap(); saveStore(); renderCardSheet(); return;
  }
  const resetVariant=t.closest("[data-resetvariant]");
  if(resetVariant){
    delete S.varOverride[resetVariant.dataset.resetvariant];
    tap(); saveStore(); renderCardSheet(); return;
  }

  /* --- Binders --- */
  const cxPer=t.closest("[data-cxper]");
  if(cxPer){ S.cx.perPage=Number(cxPer.dataset.cxper); S.cx.page=0; saveStore(); renderConcept(); return; }

  const cxSpread=t.closest("[data-cxspread]");
  if(cxSpread){ S.cx.spread=Number(cxSpread.dataset.cxspread); saveStore(); renderConcept(); return; }

  const cxBack=t.closest("[data-cxback]");
  if(cxBack){ S.cx.backing=cxBack.dataset.cxback; saveStore(); renderConcept(); return; }

  const cxSrc=t.closest("[data-cxsrc]");
  if(cxSrc){
    S.cx.source=cxSrc.dataset.cxsrc;
    saveStore(); renderConcept();
    if(S.cx.source==="all" && S.cx.setId && !S.cards[S.cx.setId]){
      fetchCards(S.cx.setId).then(renderConcept);
    }
    return;
  }

  const cxRm=t.closest("[data-cxrm]");
  if(cxRm){ S.cx.seq[Number(cxRm.dataset.cxrm)]=null; tap(); saveStore(); renderConcept(); return; }

  const cxPg=t.closest("[data-cxpage]");
  if(cxPg){
    const step=Number(cxPg.dataset.cxpage)*S.cx.spread;   // 2 tegelijk bij een spread
    S.cx.page=Math.max(0,Math.min(S.cx.page+step,Math.max(0,cxPages()-S.cx.spread)));
    saveStore(); renderConcept(); return;
  }
  if(t.closest("[data-cxaddpage]")){
    for(let i=0;i<S.cx.perPage;i++) S.cx.seq.push(null);
    S.cx.page=cxPages()-1;
    saveStore(); renderConcept(); return;
  }
  if(t.closest("#cx-setpick")){ cxOpenSetPicker(); return; }
  if(t.closest("#cx-autofill")){ cxAutoFill(); return; }
  if(t.closest("#cx-seladd")){ cxAddSelected(); return; }
  if(t.closest("#cx-selclear")){ S.cx.sel=[]; renderConcept(); return; }
  if(t.closest("#acc-google")){ signInGoogle(); return; }
  if(t.closest("#acc-signout")){ signOut(); return; }
  if(t.closest("#acc-retry-sync")){
    const btn=t.closest("#acc-retry-sync"); btn.textContent="Bezig…"; btn.disabled=true;
    saveStore();
    setTimeout(()=>renderAccount(),700);
    return;
  }
  if(t.closest("#acc-link")){ accLink(); return; }
  if(t.closest("#acc-unlink")){
    S.auth.config={url:"",key:""}; sbClient=null; sbFailed=false; S.auth.error="";
    saveConfig(); renderAccount(); toast("Ontkoppeld"); return;
  }

  const openB=t.closest("[data-openbinder]");
  if(openB){ openBinder(openB.dataset.openbinder); return; }
  if(t.closest("[data-newbinder]")){ newBinder(); return; }
  const cxDl=t.closest("[data-cxdel]");
  if(cxDl){
    e.stopPropagation();
    if(confirm("Deze binder verwijderen?")) deleteBinder(cxDl.dataset.cxdel);
    return;
  }
  const pickCover=t.closest("[data-pickcover]");
  if(pickCover){ e.stopPropagation(); openCoverPicker(pickCover.dataset.pickcover); return; }
  const setCover=t.closest("[data-setcover]");
  if(setCover){
    const b=S.binders.find(x=>x.id===S.pick.coverBinderId);
    if(b){ b.coverColor=setCover.dataset.setcover||null; saveStore(); renderShelf(); closeSheet(); }
    return;
  }

  if(t.closest("#cx-rename")){
    const b=S.cx; if(!b) return;
    const name=prompt("Naam van deze binder",b.name||"");
    if(name!=null) renameBinder(name);
    return;
  }
  const pickBtn=t.closest("[data-pickcard]");
  if(pickBtn){ assignToSlot(pickBtn.dataset.pickcard); return; }
  if(t.closest("#pick-setpick")){
    S.tplPicking=true; window._tplQuery=""; window._pickSet=true;
    openSheet("#sheet-template"); return;
  }

  if(t.closest("#push-clear")){
    const c=S.cx; if(!c) return;
    const from=c.page*c.perPage, to=Math.min(c.seq.length,(c.page+c.spread)*c.perPage);
    for(let i=from;i<to;i++) c.seq[i]=null;
    tap(); saveStore(); renderConcept(); toast("Pagina leeggemaakt"); return;
  }

  const dexMode=t.closest("[data-dexmode]");
  if(dexMode){
    S.dex.mode=dexMode.dataset.dexmode;
    $$("#dexmode-seg button").forEach(b=>b.classList.toggle("is-on",b===dexMode));
    syncSeg($("#dexmode-seg"));
    $("#dex-wrap").hidden   = S.dex.mode!=="dex";
    $("#cards-wrap").hidden = S.dex.mode!=="cards";
    if(S.dex.mode==="dex") dexLoadIndex();
    return;
  }
  const dexGen=t.closest("[data-dexgen]");
  if(dexGen){ S.dex.gen=Number(dexGen.dataset.dexgen); renderDex(); return; }

  const dexBtn=t.closest("[data-dex]");
  if(dexBtn){ openDex(Number(dexBtn.dataset.dex)); return; }

  const dexScopeBtn=t.closest("[data-dexscope]");
  if(dexScopeBtn){ dexScope=dexScopeBtn.dataset.dexscope; renderPushDex(); return; }
  if(t.closest("#dex-color-toggle")){
    S.showColor=!S.showColor;
    document.documentElement.classList.toggle("show-color",S.showColor);
    saveStore();
    toast(S.showColor?"Kleur aan":"Kleur uit");
    renderPushDex(); return;
  }

  const setBtn=t.closest("[data-set]");
  if(setBtn){ openSet(setBtn.dataset.set); return; }

  if(t.closest("#back-btn")){ closePush(); return; }

  const cardBtn=t.closest("[data-card]");
  if(cardBtn){ openCard(cardBtn.dataset.card); return; }

  const filt=t.closest("[data-filter]");
  if(filt){ pushFilter=filt.dataset.filter; renderPush(); return; }

  const stepBtn=t.closest("[data-step]");
  if(stepBtn){
    const st=stepBtn.closest(".stepper");
    step(sheetCard.c.id, st.dataset.var, Number(stepBtn.dataset.step));
    return;
  }

  if(t.closest("#wish-btn")){
    const id=sheetCard.c.id;
    if(S.wish[id]) delete S.wish[id];
    else { S.wish[id]=true; rememberMeta(sheetCard.c, sheetCard.set&&sheetCard.set.id); }
    tap(); saveStore(); refreshAll(); return;
  }

  const opener=t.closest("[data-open]");
  if(opener){ openSheet("#sheet-"+opener.dataset.open); return; }

  if(t.closest("[data-close]") || t.id==="scrim"){ closeSheet(); return; }

  const th=t.closest("[data-theme]");
  if(th){
    const v=th.dataset.theme;
    if(v==="auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme",v);
    renderSettings(); return;
  }

  const so=t.closest("[data-sort]");
  if(so){ S.collSort=so.dataset.sort; closeSheet(); renderColl(); return; }

  if(t.closest("#reset-btn")){
    S.coll={}; S.wish={}; S.order=[]; S.cond={}; S.paid={}; S.varOverride={};
    saveStore(); closeSheet(); refreshAll();
    toast("Verzameling gewist"); return;
  }

  if(t.closest("#scan-btn")){
    toast("Scannen vraagt een beeldherkennings-API"); return;
  }

  if(t.closest("#retry-ja")){
    const btn=t.closest("#retry-ja"); btn.textContent="Bezig…"; btn.disabled=true;
    fetchCatalogue("ja").then(ja=>{
      if(ja && ja.sets && ja.sets.length){
        S.sets.ja=ja.sets; S.series.ja=ja.series||{}; S.jaFailed=false;
        S.cards={}; toast("Japanse catalogus geladen");
      } else {
        S.jaFailed=true; toast("Nog steeds niet gelukt");
      }
      renderSets();
    }).catch(()=>{ S.jaFailed=true; toast("Nog steeds niet gelukt"); renderSets(); });
    return;
  }

  const collBtn=t.closest("#coll-seg button");
  if(collBtn){
    $$("#coll-seg button").forEach(b=>b.classList.toggle("is-on",b===collBtn));
    syncSeg($("#coll-seg")); syncSeg($("#dexmode-seg"));
    S.collView=collBtn.dataset.view; renderColl(); return;
  }

  if(t.closest("#header-account")){ openSheet("#sheet-account"); return; }

  const shopLink=t.closest("#shop-link");
  if(shopLink){
    // De knop heeft altijd een bestemming: jouw shopadres, of anders het
    // voorproefje dat ernaast staat. Alleen ingrijpen als er echt niets is.
    if(!shopLink.getAttribute("href") || shopLink.getAttribute("href")==="#"){
      e.preventDefault();
      toast("Stel je shopadres in bij Instellingen");
      openSheet("#sheet-settings");
    }
    return;
  }
});

/* invoervelden buiten de vaste markup */
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="add-setsearch"){ window._addQuery=t.value; renderAdd();
    requestAnimationFrame(()=>{ const el=$("#add-setsearch"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } });
    return;
  }
  const paid=t.closest("[data-paid]");
  if(paid){
    const v=parseFloat(String(t.value).replace(",","."));
    if(isNaN(v)||v<=0) delete S.paid[paid.dataset.paid]; else S.paid[paid.dataset.paid]=Math.round(v*100)/100;
    saveStore();
    return;
  }
  if(t.id==="tpl-search"){
    window._tplQuery=t.value; renderTemplate();
    requestAnimationFrame(()=>{ const el=$("#tpl-search"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } });
    return;
  }
  if(t.id==="cx-per-select"){
    S.cx.perPage=Number(t.value); S.cx.page=0; saveStore(); renderConcept(); return;
  }
  if(t.id==="pick-search"){
    S.pick.query=t.value; S.pick.setId=null;
    renderPickResults();
    requestAnimationFrame(()=>{ const el=$("#pick-search"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } });
    return;
  }
  if(t.id==="acc-url"){ S.auth.config.url=t.value.trim(); saveConfig(); return; }
  if(t.id==="acc-key"){ S.auth.config.key=t.value.trim(); saveConfig(); return; }
  if(t.id==="cx-search"){
    S.cx.query=t.value;
    renderConcept();
    requestAnimationFrame(()=>{
      const el=$("#cx-search");
      if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); }
    });
    return;
  }
  if(t.id==="shop-url-input"){
    let v=t.value.trim();
    if(v && !/^https?:\/\//i.test(v)) v="https://"+v;
    S.shopUrl=v; syncShopLink(); saveStore();
    return;
  }
});

function syncShopLink(){
  const a=$("#shop-link"); if(!a) return;
  // Zolang je nog geen eigen shopadres hebt ingevuld, opent de knop het
  // voorproefje dat naast Binder staat — zodat de knop nooit doodloopt.
  a.href = S.shopUrl || "shop-voorproefje.html";
}

$("#file-input").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{
    const box=$("#imp-box");
    if(box){ box.value=String(fr.result||""); toast(f.name+" ingelezen"); }
  };
  fr.onerror=()=>toast("Bestand kon niet gelezen worden");
  fr.readAsText(f,"utf-8");
  e.target.value="";
});
document.addEventListener("change",e=>{
  if(e.target.closest("[data-paid]")) renderCardSheet();
});

$("#set-search").addEventListener("input",renderSets);
$("#card-search").addEventListener("input",renderSearch);
$("#dex-search").addEventListener("input",e=>{ S.dex.query=e.target.value; renderDex(); });
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(openSheetEl) closeSheet();
  else if(S.pushSet) closePush();
});

const isWide = ()=> window.matchMedia("(min-width:768px)").matches;

/* Afbeeldingen: eerst webp, dan png, anders het tekstlabel eronder laten staan.
   load- en error-events bubbelen niet, dus we vangen ze in de capture-fase op. */
document.addEventListener("error",e=>{
  const img=e.target;
  if(!img || img.tagName!=="IMG") return;
  if(!img.dataset.fb && /\.webp$/i.test(img.src)){
    img.dataset.fb="1";
    img.src=img.src.replace(/\.webp$/i,".png");
    return;
  }
  img.remove();
},true);

document.addEventListener("load",e=>{
  const img=e.target;
  if(!img || img.tagName!=="IMG") return;
  if(img.classList.contains("setlogo")){
    const art=img.parentElement;
    if(art) art.classList.add("has-img");
  }
},true);

/* sleep-om-te-sluiten op sheets (alleen op smalle schermen) */
$$(".sheet").forEach(sh=>{
  let y0=null;
  sh.addEventListener("pointerdown",e=>{
    if(isWide()) return;
    if(!e.target.closest(".grabber") && !e.target.closest(".sheet-title")) return;
    y0=e.clientY; sh.style.transition="none"; sh.setPointerCapture(e.pointerId);
  });
  sh.addEventListener("pointermove",e=>{
    if(y0===null) return;
    const d=Math.max(0,e.clientY-y0);
    sh.style.transform="translateY("+d+"px)";
  });
  sh.addEventListener("pointerup",e=>{
    if(y0===null) return;
    const d=Math.max(0,e.clientY-y0);
    sh.style.transition=""; sh.style.transform="";
    y0=null;
    if(d>110) closeSheet();
  });
});

/* toetsenbord op iPad en Mac */
document.addEventListener("keydown",e=>{
  const inField=/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName||"");
  if(e.key==="/" && !inField){
    e.preventDefault();
    if(S.tab==="sets"){ $("#set-search").focus(); return; }
    if(S.tab!=="search") goTab("search");
    setTimeout(()=>{ const el=$("#card-search"); if(el) el.focus(); },60);
    return;
  }
  if(e.key==="n" && !inField && !e.metaKey && !e.ctrlKey){
    e.preventDefault(); openSheet("#sheet-add"); return;
  }
});

/* Laadt de gegevens die bij het huidige account horen. Wordt ook opnieuw
   aangeroepen na in- of uitloggen, zodat je nooit de verzameling van een
   ander te zien krijgt. */
async function bootData(){
  S.coll={}; S.wish={}; S.meta={}; S.cond={}; S.paid={}; S.varOverride={};
  S.recentSets=[]; S.snap=null; S.order=[]; S.binders=[];
  S.cx=null; S.openBinderId=null;

  const saved=await loadStore();
  if(saved){
    S.coll=saved.coll||{}; S.wish=saved.wish||{}; S.meta=saved.meta||{};
    S.cond=saved.cond||{}; S.paid=saved.paid||{}; S.varOverride=saved.varOverride||{};
    S.recentSets=saved.recentSets||[]; S.snap=saved.snap||null; S.shopUrl=saved.shopUrl||"";
    S.binders=(saved.binders||[]).map(b=>Object.assign(cxBlankBinder(b.name),b));
    S.showColor=!!saved.showColor;
    document.documentElement.classList.toggle("show-color",S.showColor);
    S.order=saved.order||[]; S.lang="en"; // Japans is tijdelijk uitgeschakeld
  }
}

async function boot(){
  syncSeg($("#coll-seg")); syncSeg($("#dexmode-seg"));

  loadConfig();
  await authRestore();          // S.auth.user klopt nu, ook vlak na een terugkeer van Google
  await migrateLocalIfNeeded(); // eenmalige overzet van lokale naar cloudgegevens, indien nodig
  await bootData();

  S.sets.en=SEED_EN;
  renderHome();

  try{
    const en=await fetchCatalogue("en");
    if(en && en.sets && en.sets.length){
      S.sets.en=en.sets; S.series.en=en.series||{};
      S.online=true; S.cards={};
    }
  }catch(e){ S.online=false; }
  // Japans staat tijdelijk uit — komt later terug, zie #retry-ja voor de
  // eerder gebouwde, taal-eenduidige laadroute die dan weer aangezet wordt.

  if(S.recentSets.length && findSet(S.recentSets[0])){ S.addSet=S.recentSets[0]; S.addMode="grid"; }

  syncShopLink();
  renderHeaderAccount();
  refreshAll();
}
boot();
</script>
