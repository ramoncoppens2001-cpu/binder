<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Binder">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23007aff'/><rect x='14' y='15' width='21' height='31' rx='3' fill='%23ffffff' opacity='.7'/><rect x='27' y='19' width='23' height='33' rx='3' fill='%23ffffff'/></svg>">
<title>Binder — Pokémon verzameling</title>
<style>
/* ============================================================
   TOKENS — iOS system palette
   ============================================================ */
:root{
  --blue:#007aff; --green:#34c759; --orange:#ff9500; --red:#ff3b30;
  --purple:#af52de; --yellow:#ffcc00; --teal:#30b0c7;

  --bg:#f2f2f7;            /* grouped background */
  --bg-elev:#ffffff;       /* cards, cells */
  --bg-elev-2:#ffffff;
  --fill:rgba(120,120,128,.12);
  --fill-2:rgba(120,120,128,.16);
  --fill-3:rgba(118,118,128,.08);
  --label:#000000;
  --label-2:rgba(60,60,67,.60);
  --label-3:rgba(60,60,67,.30);
  --separator:rgba(60,60,67,.20);
  --separator-opaque:#c6c6c8;
  --bar:rgba(249,249,249,.82);
  --tint:var(--blue);
  --shadow:0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  --shadow-sheet:0 -1px 0 rgba(0,0,0,.06), 0 -20px 60px rgba(0,0,0,.22);

  --r-cell:10px; --r-card:16px; --r-sheet:14px;
  --gut:16px;
  --spring:cubic-bezier(.32,.72,0,1);
  --ease:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a;
    --purple:#bf5af2; --yellow:#ffd60a; --teal:#40cbe0;
    --bg:#000000; --bg-elev:#1c1c1e; --bg-elev-2:#2c2c2e;
    --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.32); --fill-3:rgba(118,118,128,.18);
    --label:#ffffff; --label-2:rgba(235,235,245,.60); --label-3:rgba(235,235,245,.30);
    --separator:rgba(84,84,88,.65); --separator-opaque:#38383a;
    --bar:rgba(30,30,30,.80);
    --shadow:0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
  }
}
html[data-theme="dark"]{
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a;
  --purple:#bf5af2; --yellow:#ffd60a; --teal:#40cbe0;
  --bg:#000000; --bg-elev:#1c1c1e; --bg-elev-2:#2c2c2e;
  --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.32); --fill-3:rgba(118,118,128,.18);
  --label:#ffffff; --label-2:rgba(235,235,245,.60); --label-3:rgba(235,235,245,.30);
  --separator:rgba(84,84,88,.65); --separator-opaque:#38383a;
  --bar:rgba(30,30,30,.80);
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
}
html[data-theme="light"]{
  --bg:#f2f2f7; --bg-elev:#ffffff; --bg-elev-2:#ffffff;
  --label:#000; --label-2:rgba(60,60,67,.60); --label-3:rgba(60,60,67,.30);
  --separator:rgba(60,60,67,.20); --bar:rgba(249,249,249,.82);
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:#000; color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",system-ui,"Helvetica Neue",sans-serif;
  font-size:17px; line-height:1.29; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0;outline:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:0;height:0}

/* Layout */
#shell{
  position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);
}
#device{
  position:relative;width:100%;height:100%;max-width:none;background:var(--bg);
  overflow:hidden;display:flex;flex-direction:column;
}
.safe-top{height:env(safe-area-inset-top,0px);flex:none}

/* ============================================================
   NAV BAR + SCREENS
   ============================================================ */
#stack{position:relative;flex:1;min-height:0;background:var(--bg)}
.screen{
  position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);
}
.screen.is-active{display:flex}

.navbar{
  position:relative;flex:none;z-index:50;
  background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  transition:background .2s var(--ease);
}
.navbar::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:.5px;background:var(--separator);
  opacity:0;transition:opacity .2s var(--ease);
}
.navbar.is-scrolled::after{opacity:1}
.navbar-inline{
  height:44px;display:flex;align-items:center;justify-content:center;position:relative;padding:0 8px;
}
.navbar-inline .nb-title{
  font-size:17px;font-weight:600;letter-spacing:-.02em;
  opacity:0;transform:translateY(6px);transition:opacity .18s var(--ease),transform .18s var(--ease);
}
.navbar.is-scrolled .nb-title{opacity:1;transform:none}
.nb-left,.nb-right{position:absolute;top:0;height:44px;display:flex;align-items:center;gap:2px}
.nb-left{left:6px} .nb-right{right:10px}
.nb-btn{color:var(--tint);font-size:17px;display:flex;align-items:center;gap:1px;padding:6px;border-radius:8px}
.nb-btn:active{opacity:.4}
.nb-icon-btn{width:34px;height:34px;display:grid;place-items:center;color:var(--tint);border-radius:50%}
.nb-icon-btn:active{background:var(--fill)}

/* poppetje / inlog-pil bovenin */
.hdr-account{
  display:flex;align-items:center;gap:6px;height:34px;border-radius:99px;
  flex:none;transition:transform .18s var(--spring);
}
.hdr-account:active{transform:scale(.93)}
.hdr-account.is-out{
  background:var(--tint);color:#fff;padding:0 14px 0 11px;font-size:14px;font-weight:600;letter-spacing:-.01em;
}
.hdr-account.is-in{padding:0;width:34px}
.hdr-account .av{
  position:relative;width:30px;height:30px;border-radius:99px;background:var(--tint);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;overflow:visible;
}
.hdr-account .av img{position:absolute;inset:0;width:100%;height:100%;border-radius:99px;object-fit:cover}
.hdr-account .warn{
  position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:99px;
  background:var(--red);box-shadow:0 0 0 2px var(--bar);
}

.scroll{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding-bottom:calc(58px + env(safe-area-inset-bottom,0px) + 24px);
}
.large-title{
  padding:2px var(--gut) 8px;font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.03em;
}
.large-title.with-action{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ============================================================
   PUSHED VIEW (set detail)
   ============================================================ */
#push{
  position:absolute;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .42s var(--spring);
  box-shadow:-8px 0 30px rgba(0,0,0,.18);
  pointer-events:none;
}
#push.is-open{transform:none;pointer-events:auto}
#stack.pushed .screen.is-active{transform:translateX(-24%);filter:brightness(.92)}
.screen{transition:transform .42s var(--spring),filter .42s var(--spring)}

/* ============================================================
   TAB BAR
   ============================================================ */
#tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:300;
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  display:flex;
}
#tabbar::before{content:"";position:absolute;top:0;left:0;right:0;height:.5px;background:var(--separator)}
.tab{
  flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--label-2);transition:color .12s;
}
.tab.is-active{color:var(--tint)}
.tab:active{opacity:.55}
.tab span{font-size:10px;font-weight:500;letter-spacing:0}
.tab-shop{color:var(--green);text-decoration:none;position:relative;display:none}
.tab-shop::after{
  content:"";position:absolute;top:9px;right:calc(50% - 20px);
  width:5px;height:5px;border-right:1.6px solid currentColor;border-top:1.6px solid currentColor;
  transform:rotate(45deg);opacity:.5;
}

/* ============================================================
   LISTS (inset grouped)
   ============================================================ */
.section-hdr{
  padding:16px var(--gut) 6px;font-size:13px;font-weight:400;color:var(--label-2);
  text-transform:uppercase;letter-spacing:.02em;
}
.section-hdr.plain{text-transform:none;font-size:20px;font-weight:700;color:var(--label);letter-spacing:-.02em;padding-top:22px}
.section-hdr.row{display:flex;align-items:baseline;justify-content:space-between}
.section-hdr.row a{color:var(--tint);font-size:15px;font-weight:400;text-transform:none;letter-spacing:-.01em}
.group{
  margin:0 var(--gut) 8px;background:var(--bg-elev);border-radius:var(--r-cell);overflow:hidden;
}
.cell{
  display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:44px;position:relative;
  width:100%;text-align:left;
}
.cell + .cell::before{
  content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--separator);
}
.cell.tappable:active{background:var(--fill-3)}
.cell-main{flex:1;min-width:0}
.cell-title{font-size:17px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-sub{font-size:13px;color:var(--label-2);margin-top:2px;letter-spacing:-.01em}
.cell-val{font-size:17px;color:var(--label-2);flex:none}
.chev{flex:none;color:var(--label-3)}

/* ============================================================
   HERO / VALUE CARD
   ============================================================ */
.hero{
  margin:4px var(--gut) 0;padding:18px 18px 14px;border-radius:var(--r-card);
  background:var(--bg-elev);box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.hero-label{font-size:13px;color:var(--label-2);letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.hero-value{
  font-size:40px;font-weight:700;letter-spacing:-.035em;margin-top:4px;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
}
.delta{
  display:inline-flex;align-items:center;gap:4px;margin-top:6px;
  font-size:14px;font-weight:600;color:var(--green);letter-spacing:-.01em;
}
.delta .muted{color:var(--label-2);font-weight:400}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px var(--gut) 0}
.stat{
  background:var(--bg-elev);border-radius:var(--r-card);padding:14px;box-shadow:var(--shadow);
}
.stat-top{display:flex;align-items:center;gap:6px;color:var(--label-2);font-size:13px;letter-spacing:-.01em}
.stat-num{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.stat-num small{font-size:15px;font-weight:500;color:var(--label-2);letter-spacing:-.01em}

/* ============================================================
   PROGRESS
   ============================================================ */
.ring{flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .track{stroke:var(--fill-2)}
.ring .fill{stroke:var(--green);transition:stroke-dasharray .6s var(--spring)}
.bar{height:5px;border-radius:3px;background:var(--fill-2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--green);transition:width .5s var(--spring)}

/* ============================================================
   SEGMENTED CONTROL
   ============================================================ */
.seg{
  position:relative;display:flex;margin:6px var(--gut) 10px;padding:2px;
  background:var(--fill-3);border-radius:9px;
}
.seg .thumb{
  position:absolute;top:2px;bottom:2px;border-radius:7px;background:var(--bg-elev);
  box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  transition:transform .32s var(--spring),width .32s var(--spring);
}
@media (prefers-color-scheme:dark){ .seg .thumb{background:#636366} }
html[data-theme="dark"] .seg .thumb{background:#636366}
html[data-theme="light"] .seg .thumb{background:#fff}
.seg button{
  flex:1;position:relative;z-index:1;height:30px;font-size:13px;font-weight:600;letter-spacing:-.01em;
  color:var(--label);transition:opacity .2s;
}
.seg button:not(.is-on){opacity:.62;font-weight:500}

/* ============================================================
   SEARCH FIELD
   ============================================================ */
.searchbar{margin:0 var(--gut) 10px;display:flex;align-items:center;gap:8px}
.searchfield{
  flex:1;display:flex;align-items:center;gap:6px;background:var(--fill-3);
  border-radius:10px;padding:7px 8px;color:var(--label-2);
}
.searchfield input{flex:1;font-size:17px;letter-spacing:-.02em;color:var(--label);min-width:0}
.searchfield input::placeholder{color:var(--label-2)}
.scan-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--fill-3);color:var(--tint)}
.scan-btn:active{background:var(--fill)}

/* chips */
.chips{display:flex;gap:8px;padding:2px var(--gut) 12px;overflow-x:auto}
.chip{
  flex:none;padding:6px 13px;border-radius:99px;background:var(--fill-3);
  font-size:14px;font-weight:500;letter-spacing:-.01em;color:var(--label);
}
.chip.is-on{background:var(--tint);color:#fff}
.chip:active{opacity:.6}

/* ============================================================
   CARD GRID — the binder page (signature)
   ============================================================ */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:2px var(--gut) 8px}
.slot{
  position:relative;aspect-ratio:245/337;border-radius:8px;overflow:hidden;
  background:var(--fill-3);
  transition:transform .28s var(--spring);
}
.slot:active{transform:scale(.94)}
.slot img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1;
  transition:filter .35s var(--ease),opacity .35s var(--ease);
}
.slot .ph{
  position:absolute;inset:0;display:grid;place-items:center;z-index:0;
  font-size:15px;font-weight:600;color:var(--label-3);font-variant-numeric:tabular-nums;
}
.slot:not(.is-owned) .ph{display:none}
.qty-pill,.wish-dot{z-index:3}
/* missing = ghost slot */
.slot:not(.is-owned){box-shadow:inset 0 0 0 1.5px var(--separator)}
.slot:not(.is-owned) img{filter:grayscale(1) contrast(.85);opacity:.22}
.slot:not(.is-owned)::after{
  content:attr(data-num);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  font-size:13px;font-weight:600;color:var(--label-2);font-variant-numeric:tabular-nums;
  background:var(--bg);padding:2px 7px;border-radius:6px;
}
.slot.is-owned{box-shadow:0 1px 4px rgba(0,0,0,.14)}
.qty-pill{
  position:absolute;right:4px;bottom:4px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;
  background:var(--green);color:#fff;font-size:11px;font-weight:700;
  display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.wish-dot{
  position:absolute;left:4px;bottom:4px;width:19px;height:19px;border-radius:99px;
  background:var(--orange);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3);
}

/* "Kleur" — ontbrekende kaarten laten zien in hun echte kleur, om te
   makkelijker te herkennen welke kaart het is. De grijze wash gaat weg;
   het nummer verhuist naar een klein hoekje zodat de art zichtbaar blijft. */
html.show-color .slot:not(.is-owned) img{filter:none;opacity:1}
html.show-color .slot:not(.is-owned){box-shadow:inset 0 0 0 2px var(--orange)}
html.show-color .slot:not(.is-owned)::after{
  left:auto;top:auto;right:4px;bottom:4px;transform:none;
  background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:2px 6px;
}

/* "Snel bewerken" — een stepper direct op elk kaartje, in plaats van eerst
   het detailvenster te moeten openen. */
.slot .edit-bar{
  position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;
  background:rgba(0,0,0,.68);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
.slot .edit-bar .stepbtn{
  flex:1;height:26px;color:#fff;font-size:15px;font-weight:700;display:grid;place-items:center;
}
.slot .edit-bar .stepbtn:active{background:rgba(255,255,255,.18)}
.slot .edit-bar .n{
  flex:1;height:26px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;
  font-variant-numeric:tabular-nums;border-left:.5px solid rgba(255,255,255,.25);border-right:.5px solid rgba(255,255,255,.25);
}
.slot.is-editmode .qty-pill{display:none}

/* horizontal scroller */
.hscroll{display:flex;gap:10px;padding:2px var(--gut) 4px;overflow-x:auto}
.hscroll .slot{width:88px;flex:none}

/* set row */
.set-sym{
  width:46px;height:46px;flex:none;border-radius:9px;background:var(--fill-3);
  display:grid;place-items:center;overflow:hidden;
}
.set-sym img{width:34px;height:34px;object-fit:contain}
.set-sym .letters{font-size:13px;font-weight:700;color:var(--label-2);letter-spacing:-.02em}

/* ============================================================
   SHEET
   ============================================================ */
#scrim{
  position:absolute;inset:0;z-index:400;background:rgba(0,0,0,.42);
  opacity:0;pointer-events:none;transition:opacity .4s var(--ease);
}
#scrim.is-on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:500;max-height:92%;
  background:var(--bg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  box-shadow:var(--shadow-sheet);
  transform:translateY(101%);
  visibility:hidden;pointer-events:none;
  transition:transform .48s var(--spring),visibility 0s linear .48s;
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.sheet.is-open{
  transform:none;visibility:visible;pointer-events:auto;
  transition:transform .48s var(--spring),visibility 0s;
}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:6px auto 0;flex:none}
.sheet-scroll{overflow-y:auto;padding-bottom:20px}
.sheet-title{padding:12px var(--gut) 4px;font-size:22px;font-weight:700;letter-spacing:-.025em}
.sheet-close{
  position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:99px;
  background:var(--fill);display:grid;place-items:center;color:var(--label-2);z-index:2;
}

/* card hero in sheet */
.cardhero{padding:14px var(--gut) 6px;display:grid;place-items:center}
.cardframe{
  position:relative;width:190px;aspect-ratio:245/337;border-radius:11px;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.28);
  transform-style:preserve-3d;transition:transform .5s var(--spring);
}
.cardframe img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.cardframe .ph{position:absolute;inset:0;display:grid;place-items:center;background:var(--fill);color:var(--label-3);font-size:22px;font-weight:700}
.foil{
  position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 45%,rgba(140,220,255,.5) 50%,rgba(255,190,240,.45) 55%,transparent 70%);
  background-size:250% 250%;mix-blend-mode:color-dodge;
}
.cardframe.is-foil .foil{opacity:1}

/* stepper */
.stepper{display:flex;align-items:center;gap:0;background:var(--fill-3);border-radius:8px;overflow:hidden;flex:none}
.stepper button{width:38px;height:32px;display:grid;place-items:center;color:var(--tint);font-size:19px;font-weight:500}
.stepper button:active{background:var(--fill)}
.stepper button:disabled{color:var(--label-3)}
.stepper .n{
  min-width:34px;text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;
  border-left:.5px solid var(--separator);border-right:.5px solid var(--separator);height:32px;line-height:32px;
}

.btn-fill{
  display:block;width:calc(100% - 2*var(--gut));margin:12px var(--gut) 0;height:50px;border-radius:12px;
  background:var(--tint);color:#fff;font-size:17px;font-weight:600;letter-spacing:-.02em;
}
.btn-fill:active{opacity:.8}
.btn-tinted{background:var(--fill);color:var(--tint)}
.btn-tinted.is-on{background:var(--orange);color:#fff}

/* pills row */
.pillrow{display:flex;gap:8px;padding:6px var(--gut) 0;flex-wrap:wrap}
.pill{
  padding:5px 10px;border-radius:8px;background:var(--fill-3);
  font-size:13px;font-weight:500;color:var(--label-2);letter-spacing:-.01em;
}
.pill b{color:var(--label);font-weight:600}

/* empty state */
.empty{padding:56px 40px;text-align:center;color:var(--label-2)}
.empty h3{margin:14px 0 6px;font-size:20px;font-weight:600;color:var(--label);letter-spacing:-.02em}
.empty p{margin:0;font-size:15px;line-height:1.4}

/* toast */
#toast{
  position:absolute;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:800;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:rgba(28,28,30,.92);color:#fff;padding:9px 16px;border-radius:99px;
  font-size:14px;font-weight:500;letter-spacing:-.01em;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  transition:opacity .28s var(--ease),transform .28s var(--spring);
}
#toast.is-on{opacity:1;transform:translate(-50%,0)}

/* banner */
.banner{
  margin:0 var(--gut) 10px;padding:10px 12px;border-radius:10px;background:var(--fill-3);
  font-size:13px;color:var(--label-2);line-height:1.35;display:flex;gap:8px;align-items:flex-start;
}
.banner b{color:var(--label);font-weight:600}

.footnote{padding:10px var(--gut) 0;font-size:12px;color:var(--label-2);line-height:1.4}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

/* ============================================================
   TOEVOEGEN — knop, snelinvoer, telbalk
   ============================================================ */
.fab{
  position:absolute;right:16px;z-index:320;
  bottom:calc(50px + env(safe-area-inset-bottom,0px) + 14px);
  width:56px;height:56px;border-radius:50%;
  background:var(--tint);color:#fff;display:grid;place-items:center;
  box-shadow:0 8px 22px rgba(0,122,255,.40),0 2px 6px rgba(0,0,0,.22);
  transition:transform .32s var(--spring),opacity .25s var(--ease);
}
.fab:active{transform:scale(.88)}
.fab svg{width:26px;height:26px}
.fab.is-hidden{opacity:0;transform:scale(.6);pointer-events:none}

#sheet-add{height:94%}
.sheet-head{
  position:relative;flex:none;padding:8px var(--gut) 4px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.sheet-head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.025em}
.sheet-head .done{color:var(--tint);font-size:17px;font-weight:600;padding:6px}
.sheet-head .done:active{opacity:.5}

.picker-row{
  display:flex;align-items:center;gap:12px;margin:2px var(--gut) 10px;
  background:var(--bg-elev);border-radius:var(--r-cell);padding:10px 14px;width:calc(100% - 2*var(--gut));
  text-align:left;
}
.picker-row:active{background:var(--fill-3)}

.numrow{display:flex;gap:8px;padding:0 var(--gut) 10px}
.numrow .field{
  flex:1;display:flex;align-items:center;gap:8px;background:var(--fill-3);
  border-radius:10px;padding:9px 12px;color:var(--label-2);
}
.numrow input{flex:1;font-size:17px;letter-spacing:-.02em;color:var(--label);min-width:0}
.numrow input::placeholder{color:var(--label-2)}
.numrow .go{
  padding:0 18px;border-radius:10px;background:var(--tint);color:#fff;
  font-size:16px;font-weight:600;letter-spacing:-.01em;
}
.numrow .go:active{opacity:.75}

.hint{padding:0 var(--gut) 10px;font-size:13px;color:var(--label-2);line-height:1.35}

@keyframes pop{0%{transform:scale(1)}38%{transform:scale(1.14)}100%{transform:scale(1)}}
.slot.just-added{animation:pop .4s var(--spring);box-shadow:0 0 0 2.5px var(--green),0 1px 4px rgba(0,0,0,.14)}

.addbar{
  flex:none;display:flex;align-items:center;gap:12px;
  padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--separator);
}
.addbar[hidden]{display:none}
.addbar .count{flex:1;min-width:0}
.addbar .count b{font-size:17px;font-weight:600;letter-spacing:-.02em;display:block}
.addbar .count span{font-size:13px;color:var(--label-2)}
.addbar .undo{
  padding:8px 14px;border-radius:9px;background:var(--fill);color:var(--tint);
  font-size:15px;font-weight:600;letter-spacing:-.01em;
}
.addbar .undo:disabled{color:var(--label-3)}
.addbar .undo:active:not(:disabled){background:var(--fill-2)}

/* prijsveld */
.priceinput{
  background:var(--fill-3);border-radius:8px;padding:6px 10px;width:104px;text-align:right;
  font-size:17px;font-variant-numeric:tabular-nums;
}
.codebox{
  display:block;margin:0 var(--gut);width:calc(100% - 2*var(--gut));height:180px;resize:none;
  background:var(--fill-3);border-radius:10px;padding:10px;color:var(--label);
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0;
}

/* ============================================================
   SETTEGELS — logo als beeldmerk
   ============================================================ */
.setgrid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
  grid-auto-rows:1fr;
  padding:2px var(--gut) 14px;
}
.settile{
  background:var(--bg-elev);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow);text-align:left;
  display:flex;flex-direction:column;
  transition:transform .28s var(--spring);
}
.settile:active{transform:scale(.97)}
.settile-art{
  position:relative;flex:none;aspect-ratio:16/10;overflow:hidden;
  background:linear-gradient(140deg,var(--c1),var(--c2));
}
@media (prefers-color-scheme:dark){ .settile-art{filter:brightness(.84) saturate(.92)} }
html[data-theme="dark"] .settile-art{filter:brightness(.84) saturate(.92)}
html[data-theme="light"] .settile-art{filter:none}
.settile-code{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;letter-spacing:.01em;
  color:rgba(0,0,0,.42);text-align:center;padding:0 10px;line-height:1.1;
}
.settile-art img{
  position:absolute;top:14px;right:14px;bottom:14px;left:14px;
  width:auto;height:auto;max-width:calc(100% - 28px);max-height:calc(100% - 28px);
  margin:auto;object-fit:contain;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.28));
}
.settile-art.has-img .settile-code{display:none}
.settile-body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column}
.settile-name{
  font-size:15px;font-weight:600;letter-spacing:-.02em;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.settile-meta{font-size:12px;color:var(--label-2);margin-top:3px;font-variant-numeric:tabular-nums}
.settile .bar{margin-top:auto}

/* logobanner boven een setpagina */
.setbanner{
  margin:2px var(--gut) 0;border-radius:var(--r-card);overflow:hidden;
  position:relative;aspect-ratio:32/9;padding:16px;
  background:linear-gradient(140deg,var(--c1),var(--c2));
}
@media (prefers-color-scheme:dark){ .setbanner{filter:brightness(.86) saturate(.92)} }
html[data-theme="dark"] .setbanner{filter:brightness(.86) saturate(.92)}
html[data-theme="light"] .setbanner{filter:none}
.setbanner .settile-code{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.setbanner img{
  position:absolute;top:16px;right:16px;bottom:16px;left:16px;margin:auto;
  width:auto;height:auto;max-width:calc(100% - 32px);max-height:calc(100% - 32px);
  object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.3));
}

/* ============================================================
   POKÉDEX
   ============================================================ */
.dexgrid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  padding:2px var(--gut) 14px;
}
.dexcell{
  background:var(--bg-elev);border-radius:12px;padding:10px 8px 9px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:var(--shadow);text-align:center;position:relative;
  transition:transform .25s var(--spring);
}
.dexcell:active{transform:scale(.95)}
.dexcell img{width:60px;height:60px;object-fit:contain;image-rendering:auto}
.dexcell .ph{width:60px;height:60px;display:grid;place-items:center;color:var(--label-3);font-size:11px}
.dexcell.nosprite::before{
  content:"";width:60px;height:60px;border-radius:99px;
  background:var(--fill-3);box-shadow:inset 0 0 0 1.5px var(--separator);
}
.dexcell .no{font-size:11px;color:var(--label-3);font-variant-numeric:tabular-nums;letter-spacing:0}
.dexcell .nm{
  font-size:13px;font-weight:600;letter-spacing:-.015em;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.dexcell .own{
  position:absolute;top:6px;right:6px;min-width:18px;height:18px;padding:0 5px;
  border-radius:99px;background:var(--green);color:#fff;
  font-size:10px;font-weight:700;display:grid;place-items:center;
}
.dexhero{
  display:flex;align-items:center;gap:16px;margin:2px var(--gut) 0;
  background:var(--bg-elev);border-radius:var(--r-card);padding:16px 18px;box-shadow:var(--shadow);
}
.dexhero img{width:84px;height:84px;object-fit:contain;flex:none}
.dexhero .t{flex:1;min-width:0}
.dexhero .t h3{margin:0;font-size:24px;font-weight:700;letter-spacing:-.03em}
.dexhero .t .s{font-size:13px;color:var(--label-2);margin-top:2px}
@media (min-width:768px){
  .dexgrid{grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:14px}
  .dexcell img,.dexcell .ph{width:74px;height:74px}
  .dexcell.nosprite::before{width:74px;height:74px}
}

/* ============================================================
   BINDER CONCEPTS — pagina's samenstellen
   ============================================================ */
.cx-controls{padding:0 var(--gut) 4px}
.cx-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cx-row .lbl{font-size:13px;color:var(--label-2);flex:none;min-width:96px}
.cx-seg{position:relative;display:flex;padding:2px;background:var(--fill-3);border-radius:9px;flex:1;min-width:150px}
.cx-seg button{
  flex:1;position:relative;z-index:1;height:30px;font-size:13px;font-weight:600;
  letter-spacing:-.01em;color:var(--label);border-radius:7px;transition:opacity .2s;
}
.cx-seg button:not(.is-on){opacity:.6;font-weight:500}
.cx-seg button.is-on{background:var(--bg-elev);box-shadow:0 3px 8px rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){.cx-seg button.is-on{background:#636366}}
html[data-theme="dark"] .cx-seg button.is-on{background:#636366}

/* het "papier" van de binder */
.cx-stage{
  display:flex;gap:14px;justify-content:center;align-items:flex-start;
  padding:6px var(--gut) 4px;overflow-x:auto;
}
.cx-page{
  flex:1;min-width:0;max-width:420px;border-radius:14px;padding:12px;
  display:grid;gap:9px;position:relative;
  box-shadow:0 2px 14px rgba(0,0,0,.18);
  transition:background .25s var(--ease);
}
.cx-page.black{background:#141416;--slot-line:rgba(255,255,255,.16);--slot-fill:rgba(255,255,255,.05)}
.cx-page.white{background:#f4f4f6;--slot-line:rgba(0,0,0,.15);--slot-fill:rgba(0,0,0,.035)}
.cx-page .pgnum{
  position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);
  font-size:11px;color:var(--label-3);font-variant-numeric:tabular-nums;
}
.cx-slot{
  position:relative;aspect-ratio:245/342;border-radius:7px;overflow:hidden;
  background:var(--slot-fill);box-shadow:inset 0 0 0 1.5px var(--slot-line);
  transition:transform .2s var(--spring),box-shadow .2s var(--ease);
}
.cx-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cx-slot.filled{box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:grab}
.cx-slot.filled:active{cursor:grabbing}
.cx-slot.drop-target{box-shadow:0 0 0 3px var(--green);transform:scale(1.05)}
.cx-slot.dragging{opacity:.32}
.cx-slot .rm{
  position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:99px;
  background:rgba(0,0,0,.62);color:#fff;display:grid;place-items:center;
  opacity:0;transition:opacity .18s;z-index:2;
}
.cx-slot.filled:hover .rm{opacity:1}
@media (hover:none){.cx-slot.filled .rm{opacity:1}}

/* lade met beschikbare kaarten */
.cx-tray{margin-top:26px}
.cx-tray-hd{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:0 var(--gut) 8px;
}
.cx-tray-hd b{font-size:17px;font-weight:600;letter-spacing:-.02em}
.cx-tray-hd span{font-size:13px;color:var(--label-2)}
.cx-strip{display:flex;gap:9px;padding:2px var(--gut) 10px;overflow-x:auto}
.cx-chip{
  flex:none;width:72px;aspect-ratio:245/342;border-radius:7px;overflow:hidden;position:relative;
  background:var(--fill-3);box-shadow:0 1px 4px rgba(0,0,0,.14);
  cursor:grab;
}
/* Tijdens het slepen zetten we het scrollen even vast, zodat de pagina niet
   meebeweegt. Buiten het slepen scrollt alles gewoon. */
.cx-locked{touch-action:none !important;overflow:hidden !important}
.cx-slot.lifted{box-shadow:0 0 0 2.5px var(--blue);transform:scale(1.04)}
.cx-chip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cx-chip .n{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:13px;font-weight:600;color:var(--label-3);
}
.cx-chip.used{opacity:.34}
.cx-chip.sel{box-shadow:0 0 0 3px var(--blue);opacity:1}
.cx-chip .tick{
  position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:99px;
  background:var(--blue);color:#fff;display:none;place-items:center;z-index:2;
  box-shadow:0 1px 3px rgba(0,0,0,.35);
}
.cx-chip.sel .tick{display:grid}
.cx-selbar{
  display:flex;align-items:center;gap:10px;margin:0 var(--gut) 10px;
  background:var(--bg-elev);border-radius:var(--r-cell);padding:10px 12px;
  box-shadow:var(--shadow);
}
.cx-selbar .cnt{flex:1;min-width:0;font-size:14px;font-weight:600;letter-spacing:-.02em}
.cx-selbar .cnt span{display:block;font-size:12px;font-weight:400;color:var(--label-2)}
.cx-selbar .act{
  padding:8px 15px;border-radius:9px;background:var(--tint);color:#fff;
  font-size:14px;font-weight:600;letter-spacing:-.01em;
}
.cx-selbar .clr{padding:8px 12px;border-radius:9px;background:var(--fill);color:var(--label-2);font-size:14px}

/* ============================================================
   BOEKENPLANK — overzicht van bewaarde binders
   ============================================================ */
.shelf-wrap{padding:6px var(--gut) 2px}
.shelf-hint{font-size:13px;color:var(--label-2);padding:0 2px 12px}
.shelf{
  position:relative;display:flex;align-items:flex-end;gap:9px;
  padding:20px 4px 22px;overflow-x:auto;overflow-y:hidden;
}
.shelf::after{
  content:"";position:absolute;left:0;right:0;bottom:10px;height:12px;border-radius:5px;
  background:linear-gradient(180deg,#8a5a34,#5c3a20);
  box-shadow:0 5px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.15);
}
.book{
  position:relative;z-index:1;flex:none;width:52px;height:158px;border-radius:4px 4px 2px 2px;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:inset -7px 0 12px rgba(0,0,0,.22),0 3px 8px rgba(0,0,0,.3);
  transition:transform .22s var(--spring);cursor:pointer;
}
.book:active{transform:translateY(-8px) rotate(-1.5deg)}
.book .spine{
  flex:1;display:flex;align-items:center;justify-content:center;padding:26px 0 10px;min-width:0;
}
.book .spine span{
  writing-mode:vertical-rl;transform:rotate(180deg);
  font-size:12px;font-weight:700;letter-spacing:.01em;color:rgba(255,255,255,.94);
  text-shadow:0 1px 2px rgba(0,0,0,.35);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%;
}
.book .foot{flex:none;padding:6px 0 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.book .cnt{font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.7)}
.book .book-color{
  position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:2;
  width:22px;height:22px;border-radius:99px;background:rgba(0,0,0,.32);
  display:grid;place-items:center;opacity:0;transition:opacity .18s;
}
.book:hover .book-color,.book:active .book-color{opacity:1}
@media (hover:none){.book .book-color{opacity:.85}}
.book-add{
  flex:none;width:52px;height:158px;border-radius:4px;
  border:2px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--label-2);
}
.book-add span{font-size:11px;font-weight:600;writing-mode:vertical-rl;transform:rotate(180deg)}

/* kaftkleur-palet */
.cover-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:4px var(--gut) 20px}
.swatch{aspect-ratio:1;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.25);border:2px solid transparent}
.swatch:active{transform:scale(.92)}
.swatch-auto{
  background:var(--fill-3) !important;display:grid;place-items:center;
  font-size:11px;font-weight:600;color:var(--label-2);box-shadow:none;border:1.5px dashed var(--separator);
}

/* editor: naam bovenaan, dropdown voor vakjes, lege-vakje-plus */
.cx-namebar{padding:2px var(--gut) 14px}
.cx-namebtn{
  display:inline-flex;align-items:center;gap:2px;font-size:26px;font-weight:700;
  letter-spacing:-.03em;color:var(--label);max-width:100%;
}
.cx-namebtn svg{flex:none;margin-top:3px}
.cx-namesub{font-size:14px;color:var(--label-2);margin-top:2px}
.cx-select{
  flex:1;background:var(--fill-3);border-radius:9px;height:34px;padding:0 10px;
  font-size:14px;font-weight:600;color:var(--label);border:0;
}
.cx-empty{
  background:var(--fill-3);display:grid;place-items:center;
  transition:transform .2s var(--spring),background .18s;
}
.cx-empty .plus{font-size:22px;font-weight:300;color:var(--label-3);line-height:1}
.cx-empty:active{transform:scale(.94);background:var(--fill-2)}
@media (hover:hover){.cx-empty:hover .plus{color:var(--tint)}}

.cx-chip:active{cursor:grabbing}

/* zwevende kaart tijdens slepen */
#cx-ghost{
  position:fixed;z-index:900;pointer-events:none;border-radius:8px;overflow:hidden;
  box-shadow:0 14px 40px rgba(0,0,0,.45);opacity:.95;
  transform:translate(-50%,-50%) rotate(-3deg) scale(1.06);
  transition:opacity .15s;
}
#cx-ghost img{width:100%;height:100%;object-fit:cover;display:block}

.cx-pager{display:flex;align-items:center;justify-content:center;gap:14px;padding:26px var(--gut) 0}
.cx-pager button{
  width:36px;height:36px;border-radius:99px;background:var(--fill-3);color:var(--tint);
  display:grid;place-items:center;
}
.cx-pager button:disabled{color:var(--label-3)}
.cx-pager .pos{font-size:14px;color:var(--label-2);font-variant-numeric:tabular-nums;min-width:92px;text-align:center}

/* ============================================================
   IPAD EN MAC — zijbalk, bredere rasters, gecentreerde vensters
   ============================================================ */
.sb-head{display:none}
.fab span{display:none}

@media (min-width:768px){
  .safe-top{height:0}

  #tabbar{
    top:0;bottom:0;right:auto;width:244px;height:100%;
    flex-direction:column;align-items:stretch;gap:2px;
    padding:16px 12px 88px;
    background:var(--bg);
    -webkit-backdrop-filter:none;backdrop-filter:none;
  }
  #tabbar::before{top:0;left:auto;right:0;width:.5px;height:100%}
  .sb-head{
    display:block;padding:4px 10px 16px;
    font-size:21px;font-weight:700;letter-spacing:-.03em;
  }
  .sb-head small{display:block;font-size:12px;font-weight:400;color:var(--label-2);letter-spacing:-.01em;margin-top:2px}
  .tab{
    flex:none;height:38px;flex-direction:row;justify-content:flex-start;gap:12px;
    padding:0 10px;border-radius:8px;
  }
  .tab.is-active{background:var(--fill);color:var(--tint)}
  .tab span{font-size:15px;font-weight:500;letter-spacing:-.01em}
  .tab-shop{display:flex}
  .tab-shop::after{top:50%;right:12px;margin-top:-3px}

  .fab{
    left:12px;right:auto;bottom:16px;width:220px;height:44px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;gap:8px;

    width:min(580px,88vw);max-height:84vh;border-radius:14px;
    transform:translate(-50%,-46%) scale(.97);opacity:0;

    padding-bottom:0;

/* ============================================================
   VARIANTEN — uitsluitend uit de database, nooit geraden
   ------------------------------------------------------------
   TCGdex levert per kaart een `variants`-object dat zegt welke
   printings bestaan. Dat is de enige bron die we gebruiken.
   Is die er niet, dan zeggen we "onbekend" en laten we jou kiezen.
   Wat jij zelf kiest wint altijd en wordt onthouden.
   ============================================================ */
const VARIANTS = [
  {k:"normal",       label:"Normaal"},
  {k:"reverse",      label:"Reverse holo"},
  {k:"holo",         label:"Holo"},
  {k:"firstEdition", label:"1st Edition"},
  {k:"wPromo",       label:"W-promo"}
];
const VKEYS=VARIANTS.map(v=>v.k);

/* varianten van een kaart, met herkomst
   → {list:[...], source:"api"|"jij"|null}                        */
function variantInfo(cardId){
  const own=S.varOverride[cardId];
  if(own && own.length) return {list:VKEYS.filter(k=>own.includes(k)), source:"jij"};

  const r=resolveCard(cardId);
  const v=r && r.c && r.c.variants;
  if(v && typeof v==="object"){
    const list=VKEYS.filter(k=>v[k]===true);
    if(list.length) return {list, source:"api"};
  }
  return {list:[], source:null};
}

/* wat we in het venster tonen: bekende varianten plus alles wat je al bezit */
function variantsFor(cardId){
  const info=variantInfo(cardId);
  const list=info.list.slice();
  for(const k of VKEYS) if((S.coll[cardId+"|"+k]||0)>0 && !list.includes(k)) list.push(k);
  return {rows:VARIANTS.filter(v=>list.includes(v.k)), source:info.source};
}

/* De opslagsleutel hangt aan het account. Zo kunnen twee mensen op hetzelfde
   apparaat nooit elkaars verzameling zien, en houd je je eigen gegevens
   apart van een uitgelogde sessie. */
function storeKey(){
  return S.auth.user ? KEY_BASE+":"+S.auth.user.id : KEY_BASE;
}

function localGet(k){
  try{ return window.localStorage ? window.localStorage.getItem(k) : null; }
  catch(e){ return null; }
}
function localSet(k,v){
  try{ if(window.localStorage) window.localStorage.setItem(k,v); return true; }
  catch(e){ return false; }
}

/* ---------- verbinding met je eigen project ---------- */
let sbClient=null, sbFailed=false;

async function sbInit(){
  const c=S.auth.config;
  if(!c.url || !c.key) return null;
  if(sbClient) return sbClient;
  if(sbFailed) return null;
  try{
    const mod=await import("https://esm.sh/@supabase/supabase-js@2");
    sbClient=mod.createClient(c.url,c.key,{auth:{persistSession:true,detectSessionInUrl:true}});
    return sbClient;
  }catch(e){
    sbFailed=true;
    S.auth.error="De inlogbibliotheek kon niet geladen worden.";
    return null;
  }
}

/* Inloggen met Google gaat altijd via een volledige pagina-herlaadbeurt: je
   gaat naar Google en komt terug met de sessie verstopt in de URL. Supabase
   moet die eerst zelf uitlezen — dat gebeurt niet meteen bij het aanroepen
   van getSession(), maar iets later. Vroeger vroegen we de sessie direct op
   en gingen we daarna pas luisteren naar wijzigingen, waardoor de app soms
   al leeg begon te laden vóórdat duidelijk was dat je was ingelogd. Nu
   wachten we op de eerste keer dat Supabase zelf zegt wat de situatie is —
   dat gebeurt altijd, ook vlak na een terugkeer van Google — en pas dan
   gaat de rest van het opstarten verder. */
async function authRestore(){
  const client=await sbInit(); if(!client) return;
  let initialSeen=false;
  await new Promise(resolve=>{
    const done=()=>{ if(!initialSeen){ initialSeen=true; clearTimeout(timer); resolve(); } };
    const timer=setTimeout(done,2500);   // veiligheidsklep, mocht er onverhoopt niets terugkomen
    client.auth.onAuthStateChange((_event,session)=>{
      S.auth.user = session && session.user ? userFrom(session.user) : null;
      if(!initialSeen){ done(); return; }
      // een latere wijziging tijdens het gebruik (bijv. uitloggen), niet de opstart zelf
      renderAccount(); refreshAll();
    });
  });
}

/* Had je op dit apparaat al kaarten vóórdat je ooit inlogde, dan mag die
   verzameling niet verdwijnen. Staat er in de cloud nog niets voor dit
   account, dan zetten we wat hier stond eenmalig over; staat er al iets,
   dan wint de cloud gewoon — bootData() haalt dat vanzelf op. */
async function migrateLocalIfNeeded(){
  if(!S.auth.user) return;
  const remote=await cloudLoad();
  if(remote) return;

  let local=null;
  try{
    if(window.storage){
      const r=await window.storage.get(KEY_BASE);
      if(r && r.value) local=JSON.parse(r.value);
    }
  }catch(e){}
  if(!local){
    try{ const v=localGet(KEY_BASE); if(v) local=JSON.parse(v); }catch(e){}
  }
  const had=local && (Object.keys(local.coll||{}).length || (local.binders||[]).length);
  if(had){
    await cloudSave(local);
    toast("Je verzameling staat nu in je account");
  }
}

async function jget(url, ms=6000){
  const c = new AbortController();
  const t = setTimeout(()=>c.abort(), ms);
  try{
    const r = await fetch(url,{signal:c.signal});
    if(!r.ok) throw new Error(r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

/* Chronologische volgorde van de tijdperken. De API geeft in de setlijst
   geen releasedatum mee, dus de volgorde leggen we hier vast; onbekende
   series komen daarachter. Puur een sorteervolgorde, geen inhoudelijke claim. */
const SERIE_ORDER=["me","sv","swsh","sm","xy","bw","col","hgss","pl","dp","pop","ex","ecard","neo","gym","base","tcgp"];
function serieRank(id){
  const i=SERIE_ORDER.indexOf(String(id||"").toLowerCase());
  return i===-1 ? SERIE_ORDER.length : i;
}

/* De setlijst (/sets) bevat géén serie-verwijzing. De series-endpoints wel,
   dus daar bouwen we de catalogus mee op. Drie routes, aflopend in kwaliteit. */
async function fetchCatalogue(lang){
  // 1. GraphQL: alleen voor Engels. De query geeft geen taal mee, en als
  //    TCGdex zonder dat argument stilzwijgend Engels teruggeeft, is dat
  //    voor een Engelse aanvraag toevallig goed — voor Japans zou het
  //    ongemerkt Engelse data onder een Japans label opleveren. Dat risico
  //    nemen we niet: Japans gaat uitsluitend via de taal-eenduidige REST-
  //    endpoints hieronder, waar de taal in het pad staat, niet in een
  //    argument dat vergeten kan worden.
  if(lang==="en"){
    try{
      const q='{series{id name logo sets{id name logo symbol cardCount{total official}}}}';
      const r=await gqlRequest(q,4000);
      const series=r && r.series;
      if(Array.isArray(series) && series.length){
        const out=flattenSeries(series,lang);
        if(out.sets.length) return out;
      }
    }catch(e){ /* volgende route */ }
  }

  // 2. REST: serielijst ophalen, dan per serie de sets — taal zit in het pad
  try{
    const list=await jget(API+"/"+lang+"/series",9000);
    if(Array.isArray(list) && list.length){
      const details=await Promise.all(list.map(s=>
        jget(API+"/"+lang+"/series/"+encodeURIComponent(s.id),9000).catch(()=>null)
      ));
      const series=details.filter(Boolean);
      if(series.length){
        const out=flattenSeries(series,lang);
        if(out.sets.length) return out;
      }
    }
  }catch(e){ /* volgende route */ }

  // 3. Platte setlijst zonder serie-indeling
  const raw=await jget(API+"/"+lang+"/sets",9000);
  const sets=(raw||[]).filter(s=>s.cardCount && s.cardCount.total>0).map(s=>({
    id:s.id, name:s.name, logo:s.logo, symbol:s.symbol,
    total:s.cardCount.total, official:s.cardCount.official||s.cardCount.total,
    date:s.releaseDate||"", serie:"", serieName:"Overig",
    promo:/promo/i.test(s.name||"")
  }));
  return {sets, series:{}};
}

function flattenSeries(series,lang){
  const sets=[], map={};
  for(const s of series){
    if(!s || !s.id) continue;
    map[s.id]={id:s.id, name:s.name||s.id, logo:s.logo||null};
    for(const st of (s.sets||[])){
      const cc=st.cardCount||{};
      const total=cc.total||0;
      if(!total) continue;
      sets.push({
        id:st.id, name:st.name||st.id, logo:st.logo||null, symbol:st.symbol||null,
        total, official:cc.official||total,
        date:st.releaseDate||"",
        serie:s.id, serieName:s.name||s.id,
        promo:/promo/i.test(st.name||"")
      });
    }
  }
  sets.sort((a,b)=>{
    const r=serieRank(a.serie)-serieRank(b.serie);
    if(r) return r;
    return (b.date||"").localeCompare(a.date||"") || String(a.id).localeCompare(String(b.id));
  });
  return {sets, series:map};
}

async function gqlRequest(query,ms){
  try{
    const c=new AbortController();
    const t=setTimeout(()=>c.abort(), ms||8000);
    const res = await fetch(GQL, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({query}), signal:c.signal
    });
    clearTimeout(t);
    if(!res.ok) return null;
    const j = await res.json();
    return (j && j.data) || null;
  }catch(e){ return null; }
}

async function fetchSeries(lang){
  const raw = await jget(API+"/"+lang+"/series");
  const map={};
  for(const s of (raw||[])){
    if(s && s.id) map[s.id]={id:s.id, name:s.name||s.id, logo:s.logo||null};
  }
  return map;
}

async function fetchCards(setId){
  if(S.cards[setId]) return S.cards[setId];
  const set = findSet(setId);
  if(S.online){
    // De REST-route is de beproefde basis: namen, nummers en plaatjes.
    // Dit mag nooit wachten op de GraphQL-poging hieronder — die haalt
    // alleen varianten op en gebeurt pas ná dit resultaat, op de achtergrond.
    try{
      const d = await jget(API+"/"+S.lang+"/sets/"+setId, 7000);
      if(set && d.releaseDate && !set.date) set.date=d.releaseDate;
      const list = (d.cards||[]).map(c=>({id:c.id,localId:c.localId,name:c.name,image:c.image,rarity:c.rarity||"",variants:null}));
      if(list.length){
        S.cards[setId]=list;
        enrichVariants(setId);   // niet afwachten
        return list;
      }
    }catch(e){ /* val terug op een lege binderpagina */ }
  }
  const list=[];
  for(let i=1;i<=(set?set.total:0);i++){
    const nm = setId==="base1" && BASE1_NAMES[i-1] ? BASE1_NAMES[i-1] : null;
    list.push({
      id:setId+"-"+i, localId:String(i), name:nm, rarity:"", variants:null,
      image: set && set.serie ? ASSETS+"/"+S.lang+"/"+set.serie+"/"+setId+"/"+i : null
    });
  }
  S.cards[setId]=list;
  return list;
}

/* Varianten (welke printings bestaan) komen apart binnen via GraphQL en
   werken de kaarten in S.cards bij zodra ze binnen zijn — de binderpagina
   staat dan al klaar en wordt alleen bijgewerkt als hij nog open is. */
function enrichVariants(setId){
  // De GraphQL-query hieronder geeft geen taal mee. Voor Engels is dat
  // onschuldig (dat is vermoedelijk het stille standaardgedrag); voor
  // Japans zou het ongemerkt Engelse variantdata kunnen opleveren onder
  // een Japanse kaart, dus daar doen we dit bewust niet.
  if(S.lang!=="en") return;
  fetchSetGraphQL(setId, 6000).then(gq=>{
    if(!gq || !gq.length) return;
    const list=S.cards[setId]; if(!list) return;
    const byId={}; for(const c of gq) byId[c.id]=c;
    let changed=false;
    for(const c of list){
      const g=byId[c.id];
      if(g && g.variants && !c.variants){
        c.variants=g.variants;
        if(g.rarity && !c.rarity) c.rarity=g.rarity;
        changed=true;
      }
    }
    if(!changed) return;
    if(S.pushSet===setId) renderPush();
    if(sheetCard && sheetCard.set && sheetCard.set.id===setId &&
       openSheetEl && openSheetEl.id==="sheet-card") renderCardSheet();
  }).catch(()=>{ /* varianten blijven dan "onbekend", geen probleem */ });
}

/* De REST-setlijst geeft alleen naam en nummer. GraphQL kan per kaart
   meer velden opvragen — dit is puur een verrijking op de achtergrond,
   nooit iets waar het openen van een set op wacht. */
async function fetchSetGraphQL(setId, ms){
  const id=String(setId).replace(/"/g,'');
  const data=await gqlRequest('{set(id:"'+id+'"){releaseDate cards{id localId name image rarity variants{normal reverse holo firstEdition wPromo}}}}', ms||8000);
  const s=data && data.set;
  const cards=s && s.cards;
  if(!Array.isArray(cards) || !cards.length) return null;
  const set=findSet(setId);
  if(set && s.releaseDate && !set.date) set.date=s.releaseDate;
  const withVars=cards.filter(c=>c && c.variants && typeof c.variants==="object").length;
  return cards.map(c=>({
    id:c.id, localId:c.localId, name:c.name, image:c.image,
    rarity:c.rarity||"",
    variants:(withVars && c.variants) ? c.variants : null
  }));
}

function imgURL(c,q){ return c.image ? c.image+"/"+(q||"low")+".webp" : null; }

/* logo en symbool: de API geeft een basis-URL zonder extensie,
   voor de offline catalogus bouwen we hem zelf op */
function setLogo(set){
  if(!set) return null;
  if(set.logo) return set.logo+".webp";
  if(set.serie) return ASSETS+"/"+S.lang+"/"+set.serie+"/"+set.id+"/logo.webp";

}
function setSymbol(set){
  if(!set) return null;
  if(set.symbol) return set.symbol+".webp";
  if(set.serie) return ASSETS+"/"+S.lang+"/"+set.serie+"/"+set.id+"/symbol.webp";
  return null;
}
function setHue(id){
  let h=0; const s=String(id);
  for(let i=0;i<s.length;i++) h=(h*33+s.charCodeAt(i))>>>0;
  return h%360;
}
function setColors(id){
  const h1=setHue(id), h2=(h1+38)%360;
  return "--c1:hsl("+h1+" 66% 90%);--c2:hsl("+h2+" 58% 76%)";
}
function setCode(set){
  return String(set.id||"").toUpperCase().replace(/[-_]/g," ");
}

const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));

function findSet(id){ return (S.sets[S.lang]||[]).find(s=>s.id===id); }
function ownedQty(cardId){
  let n=0; for(const v of VARIANTS) n += S.coll[cardId+"|"+v.k]||0;
  return n;
}
function setProgress(set){
  const list = S.cards[set.id];
  let have=0;
  if(list){ for(const c of list) if(ownedQty(c.id)>0) have++; }
  else { for(const k in S.coll){ if(k.split("|")[0].startsWith(set.id+"-")) have++; } have=Math.min(have,set.total); }
  return {have, total:set.total, pct: set.total? have/set.total : 0};
}
function totalPaid(){
  let v=0;
  for(const k in S.coll) v += (S.paid[k]||0)*S.coll[k];
  return v;
}
function uniqueCount(){ return Object.keys(S.coll).filter(k=>S.coll[k]>0).length; }
function totalCards(){ let n=0; for(const k in S.coll) n+=S.coll[k]; return n; }

function setIdOf(cardId){ return cardId.slice(0, cardId.lastIndexOf("-")); }

function resolveCard(cardId){
  for(const sid in S.cards){
    const f=S.cards[sid].find(x=>x.id===cardId);
    if(f) return {c:f, set:findSet(sid)};
  }
  if(S.found[cardId]) return {c:S.found[cardId], set:findSet(setIdOf(cardId))};
  if(S.meta[cardId])  return {c:S.meta[cardId],  set:findSet(S.meta[cardId].setId||setIdOf(cardId))};
  return null;
}

function rememberSet(id){
  S.recentSets=[id].concat(S.recentSets.filter(x=>x!==id)).slice(0,8);
}

function rememberMeta(c,setId){
  if(!c) return;
  S.meta[c.id]={id:c.id,localId:c.localId,name:c.name,image:c.image,rarity:c.rarity,setId:setId||(c.setId||setIdOf(c.id))};
}

function ring(pct,size,sw){
  const r=(size-sw)/2, c=2*Math.PI*r;
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle class="track" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke-width="'+sw+'"/>'+

function serieLogo(serieId){

function serieTile(name,sets){
  const total=sets.reduce((a,s)=>a+s.total,0);
  const have=sets.reduce((a,s)=>a+setProgress(s).have,0);
  const pct=total?have/total:0;
  const serieId=sets[0]?sets[0].serie:"";
  const logo=serieLogo(serieId) || (function(){ const w=sets.find(s=>setLogo(s)); return w?setLogo(w):null; })();

      '<div class="bar"><i style="width:'+(pct*100).toFixed(1)+'%"></i></div>'+

/* Binnen een serie staan hoofdsets door elkaar met zijproducten:
   trainer kits, McDonald's-uitgaven, promoreeksen, decks. Dat is puur
   een indeling voor het gemak — er wordt geen enkele claim gedaan over
   de kaarten zelf, en bij twijfel belandt een set gewoon bij de hoofdsets. */
const SIDE_SET=/(trainer kit|mcdonald|deck|kit|tin|collection box|box set|blister|promo|black star|trick or trade|battle academy|starter|theme deck|gift|premium|elite trainer)/i;
function isSideSet(s){
  return SIDE_SET.test(s.name||"") || s.promo===true;
}

function groupBySerie(list){
  const groups={}, order=[];
  for(const s of list){
    const g=s.serieName||"Overig";
    if(!groups[g]){groups[g]=[];order.push(g);}
    groups[g].push(s);
  }
  // de setlijst bevat geen datums, dus sorteren op tijdperk en daarbinnen op id
  for(const g of order) groups[g].sort((a,b)=>
    (b.date||"").localeCompare(a.date||"") || String(b.id).localeCompare(String(a.id),undefined,{numeric:true})
  );
  order.sort((a,b)=>{
    const ra=serieRank(groups[a][0]&&groups[a][0].serie);
    const rb=serieRank(groups[b][0]&&groups[b][0].serie);
    return ra-rb || a.localeCompare(b);
  });
  return {groups,order};
}

       '<button class="btn-fill" id="retry-ja">Opnieuw proberen</button>';

  }

  // zoeken doorbreekt de indeling en toont losse sets

    return;
  }

  const {groups,order}=groupBySerie(all);

  // niveau 2: de sets binnen één serie
  if(S.serie && groups[S.serie]){
    const sets=groups[S.serie];
    const total=sets.reduce((a,s)=>a+s.total,0);
    const have=sets.reduce((a,s)=>a+setProgress(s).have,0);
    const main=sets.filter(s=>!isSideSet(s));
    const side=sets.filter(isSideSet);
    const logo=serieLogo(sets[0]&&sets[0].serie);

    let h='<button class="cell tappable" data-serie="" style="margin:0 var(--gut) 10px;background:var(--bg-elev);border-radius:var(--r-cell);width:calc(100% - 2*var(--gut))">'+
        '<svg width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="var(--tint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(180deg)"><path d="M1.5 1.5L6.5 6.5 1.5 11.5"/></svg>'+
        '<div class="cell-main"><div class="cell-title" style="color:var(--tint)">Alle series</div></div></button>';

    h+='<div class="setbanner" style="'+setColors((sets[0]&&sets[0].serie)||S.serie)+'">'+
       '<span class="settile-code">'+esc(S.serie)+'</span>'+
       (logo?'<img class="setlogo" src="'+esc(logo)+'" alt="'+esc(S.serie)+'">':'')+
       '</div>'+
       '<div class="footnote" style="padding-top:8px">'+sets.length+' sets · '+have+' van '+total+' kaarten</div>';

    if(main.length){
      h+='<div class="section-hdr">'+(side.length?"Hoofdsets":"Sets")+' · '+main.length+'</div>'+
         '<div class="setgrid">'+main.map(setTile).join("")+'</div>';
    }
    if(side.length){
      h+='<div class="section-hdr">Promo\'s en zijproducten · '+side.length+'</div>'+
         '<div class="setgrid">'+side.map(setTile).join("")+'</div>';
    }
    body.innerHTML=h;
    return;
  }

  // niveau 1: de series
  if(!order.length){
    body.innerHTML='<div class="empty"><h3>Geen sets geladen</h3><p>Zonder verbinding met TCGdex is de catalogus leeg.</p></div>';
    return;
  }
  let h="";
  if(order.length===1 && order[0]==="Overig"){
    h+='<div class="banner"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>'+
       '<div><b>Geen serie-indeling</b> — de catalogus is geladen, maar zonder koppeling aan series. Gebruik het zoekveld om een set te vinden.</div></div>';
  }
  h+='<div class="section-hdr">Series · '+order.length+'</div><div class="setgrid">'+
     order.map(name=>serieTile(name,groups[name])).join("")+'</div>';
  body.innerHTML=h;
}

function filterCards(cards,f){
  if(f==="own")  return cards.filter(c=>ownedQty(c.id)>0);
  if(f==="miss") return cards.filter(c=>ownedQty(c.id)===0);
  if(f==="wish") return cards.filter(c=>S.wish[c.id]);
  return cards;
}
function gridHTML(list){
  if(!list.length) return '<div class="empty"><h3>Niets gevonden</h3><p>Pas de filter of het zoekwoord aan.</p></div>';
  return '<div class="grid">'+list.map(c=>slotHTML(c,false,S.quickInSet)).join("")+'</div>';
}
function chip(k,label,n){
  return '<button class="chip '+(pushFilter===k?"is-on":"")+'" data-filter="'+k+'">'+esc(label)+' '+n+'</button>';
}

let sheetCard=null;

function openCard(cardId){
  const r=resolveCard(cardId);

  renderCardSheet();
  openSheet("#sheet-card");
  loadCardDetail(cardId);

/* De setlijst geeft alleen naam en nummer; varianten en zeldzaamheid staan
   in de losse kaart. Die halen we erbij zodra het venster open is. */
async function loadCardDetail(cardId){
  if(!S.online) return;
  const r=resolveCard(cardId);
  if(!r || (r.c && r.c.variants)) return;
  try{
    const d=await jget(API+"/"+S.lang+"/cards/"+encodeURIComponent(cardId),7000);
    if(!d || !d.id) return;
    Object.assign(r.c,{
      rarity:d.rarity||r.c.rarity||"",
      variants:d.variants||null,
      image:d.image||r.c.image
    });
    if(S.meta[cardId]) Object.assign(S.meta[cardId],{rarity:r.c.rarity});
    if(sheetCard && sheetCard.c && sheetCard.c.id===cardId && openSheetEl && openSheetEl.id==="sheet-card"){
      renderCardSheet();
    }
  }catch(e){ /* de schatting blijft staan */ }
}

function renderCardSheet(){
  if(!sheetCard) return;
  const {c,set}=sheetCard;
  const src=imgURL(c,"high");

/* 3D-kanteling + foliesweep, alleen op het kaartbeeld in het detailvenster */
function bindTilt(){
  const f=$("#cardframe"); if(!f) return;
  const foil=$(".foil",f);
  function move(e){
    const r=f.getBoundingClientRect();
    const x=((e.clientX??(e.touches&&e.touches[0].clientX))-r.left)/r.width;
    const y=((e.clientY??(e.touches&&e.touches[0].clientY))-r.top)/r.height;
    f.style.transition="none";
    f.style.transform="perspective(700px) rotateY("+((x-.5)*16).toFixed(2)+"deg) rotateX("+((.5-y)*16).toFixed(2)+"deg) scale(1.03)";
    if(foil) foil.style.backgroundPosition=(x*100).toFixed(0)+"% "+(y*100).toFixed(0)+"%";
  }
  function reset(){ f.style.transition=""; f.style.transform=""; }
  f.addEventListener("pointermove",move);
  f.addEventListener("pointerleave",reset);
  f.addEventListener("pointerup",reset);
}

function step(cardId,variant,delta){
  const k=cardId+"|"+variant;
  const cur=S.coll[k]||0;
  const next=Math.max(0,cur+delta);
  if(next===0){ delete S.coll[k]; delete S.cond[k]; delete S.paid[k]; } else S.coll[k]=next;

  if(next>0){
    const c=sheetCard&&sheetCard.c;
    if(c && !S.meta[cardId]) rememberMeta(c, sheetCard.set&&sheetCard.set.id);
    if(!S.order.includes(cardId)) S.order.push(cardId);
    if(delta>0){ delete S.wish[cardId]; rememberSet(setIdOf(cardId)); }
  } else if(ownedQty(cardId)===0){
    S.order=S.order.filter(x=>x!==cardId);
  }
  tap(); saveStore(); refreshAll();
}

/* Snel bewerken: +/- direct op het kaartje, zonder eerst het
   detailvenster te hoeven openen. Toevoegen hergebruikt de
   variant-bepaling van quickAdd; weghalen kiest de variant die je
   ervan hebt — bij twijfel de eerste die nog voorraad heeft. */
function gridStep(cardId, delta){
  if(delta>0){ quickAdd(cardId); return; }

  const info=variantInfo(cardId);
  const tryKeys=(info.list.length?info.list:VKEYS).map(k=>cardId+"|"+k);
  let target=tryKeys.find(k=>(S.coll[k]||0)>0);
  if(!target){
    for(const k in S.coll) if(k.indexOf(cardId+"|")===0 && S.coll[k]>0){ target=k; break; }
  }
  if(!target) return;

  const n=(S.coll[target]||0)-1;
  if(n<=0){ delete S.coll[target]; delete S.cond[target]; delete S.paid[target]; }
  else S.coll[target]=n;
  if(ownedQty(cardId)===0) S.order=S.order.filter(x=>x!==cardId);

  tap(); saveStore();
  updateSlotTile(cardId);
  updateAddBar();
}

/* Werkt de weergave van precies één kaartje bij — pil, randkleur en de
   stepper zelf — zodat het raster niet opnieuw hoeft te tekenen bij elke
   tik. Wordt ook door quickAdd gebruikt. */
function updateSlotTile(cardId){
  const slot=document.getElementById("slot-"+cardId);
  if(!slot) return;
  const q=ownedQty(cardId), owned=q>0;
  slot.classList.toggle("is-owned",owned);

  let pill=slot.querySelector(".qty-pill");
  if(owned){
    if(!pill){ pill=document.createElement("span"); pill.className="qty-pill"; slot.appendChild(pill); }
    pill.textContent=q;
  } else if(pill){ pill.remove(); }

  const bar=slot.querySelector(".edit-bar");
  if(bar){
    const n=bar.querySelector(".n"); if(n) n.textContent=q;
    const minus=bar.querySelector('[data-gridstep$="|-1"]');
    if(minus) minus.style.cssText = q ? "" : "pointer-events:none;color:rgba(255,255,255,.3)";
  }
}

function submitNumber(){
  const el=$("#add-num"); if(!el) return;
  let v=(el.value||"").trim();
  if(!v) return;
  v=v.split("/")[0].trim().replace(/^0+(?=\d)/,"");
  const cards=S.cards[S.addSet]||[];
  const c=cards.find(x=>String(x.localId).toLowerCase()===v.toLowerCase());
  if(!c){ toast("Nummer "+v+" bestaat niet in deze set"); return; }
  quickAdd(c.id);
  el.value=""; el.focus();
  const slot=document.getElementById("slot-"+c.id);
  if(slot) slot.scrollIntoView({block:"center",behavior:"smooth"});
}

function quickAdd(cardId){
  const setId = S.addSet && (S.cards[S.addSet]||[]).some(c=>c.id===cardId) ? S.addSet : setIdOf(cardId);
  const r=resolveCard(cardId);

  /* De gekozen variant geldt alleen als die kaart hem echt heeft.
     Bestaat er maar één uitvoering, dan is dat de juiste — ongeacht
     wat er bovenin staat. Zo krijgt een holo-only kaart nooit
     ten onrechte een "normaal" exemplaar. */
  const known=variantInfo(cardId).list;
  let variant=S.addVariant;
  if(known.length===1) variant=known[0];
  else if(known.length>1 && !known.includes(variant)) variant=known[0];

  const key=cardId+"|"+variant;
  S.coll[key]=(S.coll[key]||0)+1;
  if(r) rememberMeta(r.c,setId);
  if(!S.order.includes(cardId)) S.order.push(cardId);
  delete S.wish[cardId];
  S.addLog.push(key);
  rememberSet(setId);
  tap(); saveStore();

  // directe visuele bevestiging zonder de hele lijst te hertekenen
  updateSlotTile(cardId);
  const slot=document.getElementById("slot-"+cardId);
  if(slot){
    slot.classList.add("just-added");
    const dot=slot.querySelector(".wish-dot"); if(dot) dot.remove();
    setTimeout(()=>slot.classList.remove("just-added"),420);
  }
  updateAddBar();
  if(!openSheetEl || openSheetEl.id!=="sheet-add"){
    const nm=(r&&r.c&&r.c.name) ? r.c.name : ("Kaart "+(r&&r.c?r.c.localId:""));
    toast(nm+" toegevoegd");
  }
}

function undoAdd(){
  const key=S.addLog.pop();
  if(!key) return;
  const [cardId]=key.split("|");
  const n=(S.coll[key]||0)-1;
  if(n<=0) delete S.coll[key]; else S.coll[key]=n;
  if(ownedQty(cardId)===0) S.order=S.order.filter(x=>x!==cardId);
  tap(); saveStore();

  const slot=document.getElementById("slot-"+cardId);
  if(slot){
    const q=ownedQty(cardId);
    const pill=slot.querySelector(".qty-pill");
    if(q>0){ if(pill) pill.textContent=q; }
    else { if(pill) pill.remove(); slot.classList.remove("is-owned"); }
  }
  updateAddBar();
}

function updateAddBar(){
  const cEl=$("#add-count"), vEl=$("#add-value"), uEl=$("#add-undo");
  if(!cEl||!vEl||!uEl) return;
  const n=S.addLog.length;
  const uniek=new Set(S.addLog.map(k=>k.split("|")[0])).size;
  cEl.textContent = n===1 ? "1 kaart toegevoegd" : n+" kaarten toegevoegd";
  vEl.textContent = n ? uniek+" verschillende nummers" : "deze sessie";
  uEl.disabled = !n;
}
